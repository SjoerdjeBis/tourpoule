<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --txt:#e8eaed; --muted:#9aa3b2;
    --accent:#ffd60a; --accent-ink:#ffd60a; --accent2:#3aa0ff; --accent2-ink:#3aa0ff;
    --green:#36d399; --red:#f87272;
    --rank2:#cdd3dd; --rank3:#e0a878;
    --header-bg:rgba(15,17,21,.92);
    --radius:14px;
  }
  html[data-theme="light"]{
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#eceff3; --line:#dfe3e8;
    --txt:#1b1e25; --muted:#647080;
    --accent:#ffd60a; --accent-ink:#9a7400; --accent2:#3aa0ff; --accent2-ink:#1565c0;
    --green:#1a7f4b; --red:#d23b3b;
    --rank2:#8a93a3; --rank3:#b5793b;
    --header-bg:rgba(245,246,248,.92);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  header{
    position:sticky; top:0; z-index:10; background:var(--header-bg);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-top));
    padding-top:max(12px,env(safe-area-inset-top));
  }
  .titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;letter-spacing:.3px}
  h1 .dot{color:var(--accent-ink)}
  .yearsw{margin-left:auto;display:flex;gap:6px}
  .yearsw button{
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    padding:6px 12px;border-radius:999px;font-weight:600;cursor:pointer;font-size:14px;
  }
  .yearsw button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .iconbtn{margin-left:8px;flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;
    font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn:active{background:var(--line)}
  .search{margin-top:10px;position:relative}
  .search input{
    width:100%;padding:12px 14px 12px 40px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:16px;
  }
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{
    flex:0 0 auto;background:none;border:none;color:var(--muted);
    padding:8px 4px;font-size:15px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;
  }
  .tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
  main{padding:14px 16px 60px;max-width:780px;margin:0 auto}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;
  }
  .row{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;color:var(--txt);cursor:pointer;font-size:16px;
  }
  .row:active{background:var(--panel2)}
  .row .sub{color:var(--muted);font-size:13px}
  .row .chev{margin-left:auto;color:var(--muted)}
  .pill{
    display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:var(--panel2);color:var(--muted);border:1px solid var(--line);
  }
  .pill.out{background:rgba(248,114,114,.15);color:var(--red);border-color:transparent}
  .badge{
    display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;
    border-radius:8px;font-weight:700;font-size:13px;background:var(--panel2);color:var(--accent-ink);
    padding:0 6px;
  }
  .badge.res{color:var(--accent2-ink)}
  .badge.bib{color:var(--txt);background:var(--panel2)}
  .pickline{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .pickline:last-child{border-bottom:none}
  .pickline .nm{font-weight:600}
  .pickline .tm{color:var(--muted);font-size:12px}
  .section-h{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.wrap{white-space:normal}
  table.bd{font-size:13px}
  table.bd th,table.bd td{padding:6px 8px}
  table.bd th.num,table.bd td.num{min-width:30px}
  table.bd td:first-child,table.bd th:first-child{
    position:sticky;left:0;background:var(--panel);z-index:1;
    box-shadow:1px 0 0 var(--line);
  }
  tr.ft td{border-top:2px solid var(--line);font-weight:700;border-bottom:none}
  tr.ft td:first-child{color:var(--muted)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .rank{color:var(--muted);width:30px}
  .rank.top1{color:var(--accent-ink)} .rank.top2{color:var(--rank2)} .rank.top3{color:var(--rank3)}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--accent2-ink);
    background:none;border:none;font-size:15px;cursor:pointer;padding:4px 0;margin-bottom:6px}
  .name-big{font-size:22px;font-weight:700;margin:2px 0}
  .stagesel{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
  .stagesel button{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);
    color:var(--muted);border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
  .stagesel button.on{background:var(--accent2);color:#06243f;border-color:var(--accent2)}
  .sharelink{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 10px;
    background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
    color:var(--accent2-ink);text-decoration:none;font-weight:600;font-size:15px}
  .sharelink:active{background:var(--line)}
  .ok{color:var(--green);font-weight:700}
  .no{color:var(--muted)}
  .right{margin-left:auto}
  .meta-foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
  .grid2{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
</style>

<script>
const DB = JSON.parse(document.getElementById('data').textContent);
const state = { year:null, tab:'deelnemers', q:'', detail:null, stage:null, riderDetail:null, riderSort:'name' };
const TABS = [
  {id:'deelnemers', label:'Deelnemers'},
  {id:'renners', label:'Renners'},
  {id:'tussenstand', label:'Tussenstand'},
  {id:'eindstand', label:'Eindstand'},
];
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function cur(){ return DB.years[state.year]; }

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t==='light'?'light':'dark');
  const b=document.getElementById('themebtn');
  if(b){ b.textContent = t==='light'?'🌙':'☀️'; }
}
function toggleTheme(){
  const next = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  try{ localStorage.setItem('tp-theme', next); }catch(e){}
  applyTheme(next);
}
window.toggleTheme=toggleTheme;

function renderHeader(){
  const ys = Object.keys(DB.years).sort().reverse();
  document.getElementById('yearsw').innerHTML = ys.map(y=>
    `<button class="${y===state.year?'on':''}" onclick="setYear('${y}')">${y}</button>`).join('');
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    `<button class="${t.id===state.tab?'on':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('');
}
function setYear(y){ state.year=y; state.detail=null; state.riderDetail=null; render(); }
function setTab(t){ state.tab=t; state.detail=null; state.stage=null; state.riderDetail=null; render(); }
window.setYear=setYear; window.setTab=setTab;

document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value; state.detail=null; state.riderDetail=null; render(); });

function rankClass(r){ return r===1?'top1':r===2?'top2':r===3?'top3':''; }

function viewDeelnemers(d, q){
  if(!d.deelnemers.length) return `<div class="empty">Nog geen deelnemers in ${d.year}.<br><span class="muted">Verschijnen hier zodra de inzendingen zijn geïmporteerd.</span></div>`;
  if(state.detail){
    const p = d.deelnemers.find(x=>x.id===state.detail);
    if(p) return detailDeelnemer(p);
  }
  const list = d.deelnemers.filter(p=>{
    if(!q) return true;
    if(norm(p.name).includes(q) || norm(p.doping).includes(q)) return true;
    return p.main.concat(p.reserves).some(s=>norm(s.rider).includes(q));
  });
  if(!list.length) return `<div class="empty">Geen deelnemer gevonden voor “${esc(state.q)}”.</div>`;
  return list.map(p=>`
    <button class="row" onclick="openDeelnemer(${p.id})">
      <div>
        <div class="nm">${esc(p.name)}</div>
      </div>
      <span class="chev">›</span>
    </button>`).join('');
}

function detailDeelnemer(p){
  const pick = (s,cls)=>`
    <div class="pickline">
      <span class="badge ${cls}">${cls==='res'?'R'+s.nr:s.nr}</span>
      <div><div class="nm">${esc(s.rider)}</div><div class="tm">${esc(s.team)}</div></div>
    </div>`;
  const extra = p.extra.length ? `
    <div class="section-h">Extra voorspellingen</div>
    <div class="card">${p.extra.map(e=>`
      <div class="pickline"><div class="tm" style="min-width:130px">${esc(e.label)}</div><div class="nm">${esc(e.pick)}</div></div>`).join('')}
      ${p.own_pos?`<div class="pickline"><div class="tm" style="min-width:130px">Eigen eindpositie</div><div class="nm">${esc(p.own_pos)}</div></div>`:''}
    </div>` : '';
  return `
    <button class="back" onclick="closeDetail()">‹ terug</button>
    <div class="name-big">${esc(p.name)}</div>
    ${p.doping?`<div class="muted">${esc(p.doping)}</div>`:''}
    ${breakdownTable(p.breakdown)}
    <div class="section-h">Hoofdrenners (1–15)</div>
    <div class="card">${p.main.map(s=>pick(s,'main')).join('')||'<span class="muted">—</span>'}</div>
    <div class="section-h">Reserves (1–5)</div>
    <div class="card">${p.reserves.map(s=>pick(s,'res')).join('')||'<span class="muted">—</span>'}</div>
    ${extra}`;
}

function breakdownTable(b){
  if(!b || !b.riders.length) return '';
  const cols = cur().stages.map(s=>s.n);
  const head = `<tr><th>Renner</th>${cols.map(n=>`<th class="num">E${n}</th>`).join('')}<th class="num">Tot</th></tr>`;
  const body = b.riders.map(r=>`<tr><td class="wrap">${esc(r.name)}</td>${
    cols.map(n=>{const v=r.perStage[n];return `<td class="num">${v?v:''}</td>`;}).join('')
  }<td class="num"><b>${r.total}</b></td></tr>`).join('');
  const foot = `<tr class="ft"><td>Totaal</td>${
    cols.map(n=>{const v=b.stageTotals[n];return `<td class="num">${v?v:''}</td>`;}).join('')
  }<td class="num"><b>${b.total}</b></td></tr>`;
  return `<div class="section-h">Punten per renner & etappe</div>
    <div class="card"><div class="tw"><table class="bd">${head}${body}${foot}</table></div>
    <div class="muted" style="font-size:12px;margin-top:8px">Alleen renners die punten scoorden. Reserves tellen mee vanaf de etappe waarin ze invielen.</div></div>`;
}
function openDeelnemer(id){ state.detail=id; render(); }
function closeDetail(){ state.detail=null; render(); }
window.openDeelnemer=openDeelnemer; window.closeDetail=closeDetail;

function viewRenners(d, q){
  if(!d.riders.length) return `<div class="empty">Nog geen renners in ${d.year}.</div>`;
  if(state.riderDetail){
    const r = d.riders.find(x=>x.id===state.riderDetail);
    if(r) return detailRider(r);
  }
  let list = d.riders.filter(r=> !q || norm(r.name).includes(q) || norm(r.team).includes(q));
  if(!list.length) return `<div class="empty">Geen renner gevonden voor “${esc(state.q)}”.</div>`;

  const hasBib = d.riders.some(r=>r.bib!=null);
  if(state.riderSort==='bib' && hasBib){
    list = list.slice().sort((a,b)=>{
      if(a.bib==null && b.bib==null) return a.name.localeCompare(b.name);
      if(a.bib==null) return 1;
      if(b.bib==null) return -1;
      return a.bib-b.bib;
    });
  }
  // (alfabet = standaardvolgorde uit de data)

  const nOut = d.riders.filter(r=>r.out).length;
  const sorter = hasBib ? `
    <div class="stagesel" style="margin-bottom:10px">
      <button class="${state.riderSort==='name'?'on':''}" onclick="setRiderSort('name')">A–Z</button>
      <button class="${state.riderSort==='bib'?'on':''}" onclick="setRiderSort('bib')">Rugnummer</button>
    </div>` : '';
  const head = `${sorter}<div class="muted" style="margin-bottom:10px">${d.riders.length} renners${nOut?` · ${nOut} uitgevallen`:''}</div>`;
  return head + list.map(r=>`
    <button class="row" onclick="openRider(${r.id})">
      ${r.bib!=null?`<span class="badge bib">${r.bib}</span>`:''}
      <div>
        <div class="nm">${esc(r.name)}</div>
        <div class="sub">${esc(r.team)}</div>
      </div>
      ${r.out?`<span class="pill out right">${esc(r.out.type)} · E${r.out.stage}</span>`:'<span class="chev right">›</span>'}
    </button>`).join('');
}
function setRiderSort(s){ state.riderSort=s; render(); }
function openRider(id){ state.riderDetail=id; render(); }
function closeRider(){ state.riderDetail=null; render(); }
window.setRiderSort=setRiderSort; window.openRider=openRider; window.closeRider=closeRider;

function detailRider(r){
  const badges = [
    r.bib!=null?`<span class="pill">Rugnr ${r.bib}</span>`:'',
    r.nat?`<span class="pill">${esc(r.nat)}</span>`:'',
    r.out?`<span class="pill out">${esc(r.out.type)} · uit vanaf E${r.out.effective}</span>`:'',
  ].join(' ');
  let points;
  if(r.stagePoints && r.stagePoints.length){
    points = `<div class="section-h">Punten per etappe</div>
      <div class="card"><div class="tw"><table>
        <thead><tr><th class="num">Etappe</th><th class="num">Plaats</th><th class="num">Punten</th></tr></thead>
        <tbody>${r.stagePoints.map(s=>`<tr><td class="num">E${s.stage}</td><td class="num rank ${rankClass(s.rank)}">${s.rank}e</td><td class="num">${s.points}</td></tr>`).join('')}
        <tr class="ft"><td>Totaal</td><td></td><td class="num"><b>${r.total}</b></td></tr>
        </tbody></table></div></div>`;
  } else {
    points = `<div class="card"><span class="muted">Nog geen punten gescoord (geen top-20-plek in een etappe).</span></div>`;
  }
  return `
    <button class="back" onclick="closeRider()">‹ terug</button>
    <div class="name-big">${esc(r.name)}</div>
    <div class="muted">${esc(r.team)}</div>
    ${badges.trim()?`<div style="margin-top:8px">${badges}</div>`:''}
    ${points}`;
}

function viewTussenstand(d){
  const hasStages = d.stages.length>0;
  if(!hasStages && !d.standings.length)
    return `<div class="empty">Nog geen tussenstand in ${d.year}.<br><span class="muted">Verschijnt zodra etappes zijn verwerkt.</span></div>`;
  let html = '';
  if(d.standings.length){
    const upto = hasStages ? Math.max(...d.stages.map(s=>s.n)) : '';
    html += `<div class="section-h">Klassement${upto?` t/m etappe ${upto}`:''}</div>` + standingsTable(d.standings);
  }
  if(hasStages){
    html += `<div class="section-h">Per etappe</div>` + stageBrowser(d);
  }
  return html;
}

function viewEindstand(d){
  if(!d.eindstand)
    return `<div class="empty">Eindstand nog niet vastgesteld voor ${d.year}.<br><span class="muted">Verschijnt zodra de winnaars zijn ingevuld (menu: Na de Tour).</span></div>`;
  return `<div class="section-h">Eindstand ${d.year}</div>` + eindstandTable(d.eindstand);
}

function standingsTable(rows){
  return `<div class="card"><div class="tw"><table><thead><tr><th class="num">#</th><th>Deelnemer</th><th class="num">Totaal</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.name)}</td><td class="num">${r.total}</td></tr>`).join('')
  }</tbody></table></div></div>`;
}

function eindstandTable(e){
  return `<div class="card"><div class="tw"><table><thead><tr><th class="num">#</th><th>Deelnemer</th><th class="num">Tour</th><th class="num">Bonus</th><th class="num">Totaal</th></tr></thead><tbody>${
    e.rows.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.name)}</td><td class="num">${r.tour}</td><td class="num">${r.bonus}</td><td class="num"><b>${r.final}</b></td></tr>`).join('')
  }</tbody></table></div></div>
  <div class="section-h">Vastgestelde winnaars</div>
  <div class="card">${e.categories.map(c=>`<div class="pickline"><div class="tm" style="min-width:140px">${esc(c.label)}</div><div class="nm">${esc(c.winner)}</div></div>`).join('')}</div>`;
}

function stageBrowser(d){
  const stages = d.stages;
  if(state.stage==null) state.stage = stages[stages.length-1].n;
  const sel = stages.map(s=>`<button class="${s.n===state.stage?'on':''}" onclick="setStage(${s.n})">E${s.n}</button>`).join('');
  const st = stages.find(s=>s.n===state.stage) || stages[stages.length-1];
  const results = `<div class="card"><div class="muted" style="margin-bottom:6px">Top 20 etappe ${st.n}</div><div class="tw"><table><thead><tr><th class="num">#</th><th>Renner</th><th class="num">Pt</th></tr></thead><tbody>${
    st.results.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.rider)}<div class="tm">${esc(r.team)}</div></td><td class="num">${r.points}</td></tr>`).join('')
  }</tbody></table></div></div>`;
  const dag = st.dagscore.length ? `<div class="card"><div class="muted" style="margin-bottom:6px">Dagscore deelnemers</div><div class="tw"><table><thead><tr><th class="num">#</th><th>Deelnemer</th><th class="num">Pt</th></tr></thead><tbody>${
    st.dagscore.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.name)}</td><td class="num">${r.score}</td></tr>`).join('')
  }</tbody></table></div></div>` : '';
  const share = `<a class="sharelink" href="bissusconi/${d.year}/${st.n}/" target="_blank" rel="noopener">Deelbare tussenstand-pagina van etappe ${st.n} openen <span aria-hidden="true">↗</span></a>`;
  return `<div class="stagesel">${sel}</div><div class="grid2">${results}${dag}</div>${share}`;
}
function setStage(n){ state.stage=n; render(); }
window.setStage=setStage;

function render(){
  renderHeader();
  const d = cur();
  const q = norm(state.q);
  let html='';
  if(state.tab==='deelnemers') html=viewDeelnemers(d,q);
  else if(state.tab==='renners') html=viewRenners(d,q);
  else if(state.tab==='eindstand') html=viewEindstand(d);
  else html=viewTussenstand(d);
  document.getElementById('app').innerHTML = html +
    `<div class="meta-foot">Bijgewerkt: ${esc(DB.generated_at)}</div>`;
  window.scrollTo({top:0});
  const onBtn = document.querySelector('.stagesel button.on');
  if(onBtn) onBtn.scrollIntoView({inline:'center', block:'nearest'});
}

(function init(){
  applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
  const ys = Object.keys(DB.years).sort().reverse();
  // Start op het meest recente jaar dat deelnemers heeft, anders het nieuwste.
  state.year = ys.find(y=>DB.years[y].deelnemers.length) || ys[0];
  render();
})();
</script>
</body>
</html>
