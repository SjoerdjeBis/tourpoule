<style>
  :root{

    --green:#36d399; --red:#f87272; --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  header{
    position:sticky; top:0; z-index:10; background:rgba(15,17,21,.92);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
    padding:12px 16px calc(12px + env(safe-area-inset-top));
    padding-top:max(12px,env(safe-area-inset-top));
  }
  .titlerow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;letter-spacing:.3px}
  h1 .dot{color:var(--accent)}
  .yearsw{margin-left:auto;display:flex;gap:6px}
  .yearsw button{
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    padding:6px 12px;border-radius:999px;font-weight:600;cursor:pointer;font-size:14px;
  }
  .yearsw button.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .search{margin-top:10px;position:relative}
  .search input{
    width:100%;padding:12px 14px 12px 40px;border-radius:12px;
    border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:16px;
  }
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .tabs{display:flex;gap:6px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{
    flex:0 0 auto;background:none;border:none;color:var(--muted);
    padding:8px 4px;font-size:15px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;
  }
  .tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
  main{padding:14px 16px 60px;max-width:780px;margin:0 auto}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:10px;
  }
  .row{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:8px;color:var(--txt);cursor:pointer;font-size:16px;
  }
  .row:active{background:var(--panel2)}
  .row .sub{color:var(--muted);font-size:13px}
  .row .chev{margin-left:auto;color:var(--muted)}
  .pill{
    display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:var(--panel2);color:var(--muted);border:1px solid var(--line);
  }
  .pill.out{background:rgba(248,114,114,.15);color:var(--red);border-color:transparent}
  .badge{
    display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;
    border-radius:8px;font-weight:700;font-size:13px;background:var(--panel2);color:var(--accent);
    padding:0 6px;
  }
  .badge.res{color:var(--accent2)}
  .pickline{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
  .pickline:last-child{border-bottom:none}
  .pickline .nm{font-weight:600}
  .pickline .tm{color:var(--muted);font-size:12px}
  .section-h{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:16px 0 8px}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.wrap{white-space:normal}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .rank{color:var(--muted);width:30px}
  .rank.top1{color:var(--accent)} .rank.top2{color:#cdd3dd} .rank.top3{color:#e0a878}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--accent2);
    background:none;border:none;font-size:15px;cursor:pointer;padding:4px 0;margin-bottom:6px}
  .name-big{font-size:22px;font-weight:700;margin:2px 0}
  .stagesel{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
  .stagesel button{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);
    color:var(--muted);border-radius:8px;padding:6px 10px;font-weight:700;cursor:pointer}
  .stagesel button.on{background:var(--accent2);color:#06243f;border-color:var(--accent2)}
  .ok{color:var(--green);font-weight:700}
  .no{color:var(--muted)}
  .right{margin-left:auto}
  .meta-foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
  .grid2{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
</style>
</head>

<script>
const DB = JSON.parse(document.getElementById('data').textContent);
const state = { year:null, tab:'deelnemers', q:'', detail:null, stage:null };
const TABS = [
  {id:'deelnemers', label:'Deelnemers'},
  {id:'renners', label:'Renners'},
  {id:'standen', label:'Standen'},
];
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function cur(){ return DB.years[state.year]; }

function renderHeader(){
  const ys = Object.keys(DB.years).sort().reverse();
  document.getElementById('yearsw').innerHTML = ys.map(y=>
    `<button class="${y===state.year?'on':''}" onclick="setYear('${y}')">${y}</button>`).join('');
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    `<button class="${t.id===state.tab?'on':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('');
}
function setYear(y){ state.year=y; state.detail=null; render(); }
function setTab(t){ state.tab=t; state.detail=null; state.stage=null; render(); }
window.setYear=setYear; window.setTab=setTab;

document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value; state.detail=null; render(); });

function rankClass(r){ return r===1?'top1':r===2?'top2':r===3?'top3':''; }

function viewDeelnemers(d, q){
  if(!d.deelnemers.length) return `<div class="empty">Nog geen deelnemers in ${d.year}.<br><span class="muted">Verschijnen hier zodra de inzendingen zijn geïmporteerd.</span></div>`;
  if(state.detail){
    const p = d.deelnemers.find(x=>x.id===state.detail);
    if(p) return detailDeelnemer(p);
  }
  const list = d.deelnemers.filter(p=>{
    if(!q) return true;
    if(norm(p.name).includes(q) || norm(p.doping).includes(q)) return true;
    return p.main.concat(p.reserves).some(s=>norm(s.rider).includes(q));
  });
  if(!list.length) return `<div class="empty">Geen deelnemer gevonden voor “${esc(state.q)}”.</div>`;
  return list.map(p=>`
    <button class="row" onclick="openDeelnemer(${p.id})">
      <div>
        <div class="nm">${esc(p.name)}</div>
        ${p.doping?`<div class="sub">${esc(p.doping)}</div>`:''}
      </div>
      <span class="chev">›</span>
    </button>`).join('');
}

function detailDeelnemer(p){
  const pick = (s,cls)=>`
    <div class="pickline">
      <span class="badge ${cls}">${cls==='res'?'R'+s.nr:s.nr}</span>
      <div><div class="nm">${esc(s.rider)}</div><div class="tm">${esc(s.team)}</div></div>
    </div>`;
  const extra = p.extra.length ? `
    <div class="section-h">Extra voorspellingen</div>
    <div class="card">${p.extra.map(e=>`
      <div class="pickline"><div class="tm" style="min-width:130px">${esc(e.label)}</div><div class="nm">${esc(e.pick)}</div></div>`).join('')}
      ${p.own_pos?`<div class="pickline"><div class="tm" style="min-width:130px">Eigen eindpositie</div><div class="nm">${esc(p.own_pos)}</div></div>`:''}
    </div>` : '';
  return `
    <button class="back" onclick="closeDetail()">‹ terug</button>
    <div class="name-big">${esc(p.name)}</div>
    ${p.doping?`<div class="muted">${esc(p.doping)}</div>`:''}
    <div class="section-h">Hoofdrenners (1–15)</div>
    <div class="card">${p.main.map(s=>pick(s,'main')).join('')||'<span class="muted">—</span>'}</div>
    <div class="section-h">Reserves (1–5)</div>
    <div class="card">${p.reserves.map(s=>pick(s,'res')).join('')||'<span class="muted">—</span>'}</div>
    ${extra}`;
}
function openDeelnemer(id){ state.detail=id; render(); }
function closeDetail(){ state.detail=null; render(); }
window.openDeelnemer=openDeelnemer; window.closeDetail=closeDetail;

function viewRenners(d, q){
  if(!d.riders.length) return `<div class="empty">Nog geen renners in ${d.year}.</div>`;
  const list = d.riders.filter(r=> !q || norm(r.name).includes(q) || norm(r.team).includes(q));
  if(!list.length) return `<div class="empty">Geen renner gevonden voor “${esc(state.q)}”.</div>`;
  const nOut = d.riders.filter(r=>r.out).length;
  const head = `<div class="muted" style="margin-bottom:10px">${d.riders.length} renners${nOut?` · ${nOut} uitgevallen`:''}</div>`;
  return head + list.map(r=>`
    <div class="row" style="cursor:default">
      <div>
        <div class="nm">${esc(r.name)}</div>
        <div class="sub">${esc(r.team)}</div>
      </div>
      ${r.out?`<span class="pill out right">${esc(r.out.type)} · E${r.out.stage}</span>`:''}
    </div>`).join('');
}

function viewStanden(d){
  const hasStages = d.stages.length>0;
  const hasEind = !!d.eindstand;
  if(!hasStages && !hasEind) return `<div class="empty">Nog geen uitslagen in ${d.year}.<br><span class="muted">Verschijnen zodra etappes zijn verwerkt.</span></div>`;

  let html = '';
  if(hasEind){
    html += `<div class="section-h">Eindstand ${d.year}</div>` + eindstandTable(d.eindstand);
  } else if(d.standings.length){
    const upto = hasStages ? Math.max(...d.stages.map(s=>s.n)) : '';
    html += `<div class="section-h">Klassement${upto?` t/m etappe ${upto}`:''}</div>` + standingsTable(d.standings);
  }
  if(hasStages){
    html += `<div class="section-h">Per etappe</div>` + stageBrowser(d);
  }
  return html;
}

function standingsTable(rows){
  return `<div class="card"><div class="tw"><table><thead><tr><th class="num">#</th><th>Deelnemer</th><th class="num">Totaal</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.name)}${r.doping?` <span class="muted">· ${esc(r.doping)}</span>`:''}</td><td class="num">${r.total}</td></tr>`).join('')
  }</tbody></table></div></div>`;
}

function eindstandTable(e){
  return `<div class="card"><div class="tw"><table><thead><tr><th class="num">#</th><th>Deelnemer</th><th class="num">Tour</th><th class="num">Bonus</th><th class="num">Totaal</th></tr></thead><tbody>${
    e.rows.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.name)}${r.doping?` <span class="muted">· ${esc(r.doping)}</span>`:''}</td><td class="num">${r.tour}</td><td class="num">${r.bonus}</td><td class="num"><b>${r.final}</b></td></tr>`).join('')
  }</tbody></table></div></div>
  <div class="section-h">Vastgestelde winnaars</div>
  <div class="card">${e.categories.map(c=>`<div class="pickline"><div class="tm" style="min-width:140px">${esc(c.label)}</div><div class="nm">${esc(c.winner)}</div></div>`).join('')}</div>`;
}

function stageBrowser(d){
  const stages = d.stages;
  if(state.stage==null) state.stage = stages[stages.length-1].n;
  const sel = stages.map(s=>`<button class="${s.n===state.stage?'on':''}" onclick="setStage(${s.n})">E${s.n}</button>`).join('');
  const st = stages.find(s=>s.n===state.stage) || stages[stages.length-1];
  const results = `<div class="card"><div class="muted" style="margin-bottom:6px">Top 20 etappe ${st.n}</div><div class="tw"><table><thead><tr><th class="num">#</th><th>Renner</th><th class="num">Pt</th></tr></thead><tbody>${
    st.results.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.rider)}<div class="tm">${esc(r.team)}</div></td><td class="num">${r.points}</td></tr>`).join('')
  }</tbody></table></div></div>`;
  const dag = st.dagscore.length ? `<div class="card"><div class="muted" style="margin-bottom:6px">Dagscore deelnemers</div><div class="tw"><table><thead><tr><th class="num">#</th><th>Deelnemer</th><th class="num">Pt</th></tr></thead><tbody>${
    st.dagscore.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.name)}</td><td class="num">${r.score}</td></tr>`).join('')
  }</tbody></table></div></div>` : '';
  return `<div class="stagesel">${sel}</div><div class="grid2">${results}${dag}</div>`;
}
function setStage(n){ state.stage=n; render(); }
window.setStage=setStage;

function render(){
  renderHeader();
  const d = cur();
  const q = norm(state.q);
  let html='';
  if(state.tab==='deelnemers') html=viewDeelnemers(d,q);
  else if(state.tab==='renners') html=viewRenners(d,q);
  else html=viewStanden(d);
  document.getElementById('app').innerHTML = html +
    `<div class="meta-foot">Bijgewerkt: ${esc(DB.generated_at)}</div>`;
  window.scrollTo({top:0});
  const onBtn = document.querySelector('.stagesel button.on');
  if(onBtn) onBtn.scrollIntoView({inline:'center', block:'nearest'});
}

(function init(){
  const ys = Object.keys(DB.years).sort().reverse();
  // Start op het meest recente jaar dat deelnemers heeft, anders het nieuwste.
  state.year = ys.find(y=>DB.years[y].deelnemers.length) || ys[0];
  render();
})();
</script>
