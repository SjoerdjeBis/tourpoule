<!DOCTYPE html>
<html lang="nl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bissusconi Wrapped</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--line:#2a2f3a;--txt:#e8eaed;
  --muted:#9aa3b2;--accent:#f6d417;--green:#36d399;--red:#f87272;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#000;color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;overflow:hidden;
  overscroll-behavior:none}
/* Hoogte vastzetten op de KLEINE viewport (svh): die verandert niet als de
   adresbalk van de telefoon in- of uitschuift. Met vh/dvh verspringt de
   verticaal gecentreerde tekst bij elk veegje. */
.deck{position:fixed;inset:0;height:100vh;height:100svh;
  max-width:520px;margin:0 auto;background:var(--bg);overflow:hidden;touch-action:manipulation}
.card{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:calc(58px + env(safe-area-inset-top)) 26px
  calc(40px + env(safe-area-inset-bottom));gap:14px}
.card.on{display:flex;z-index:6;pointer-events:none}
/* De kaart ligt bóven de tik-zones, maar laat tikken door: alleen echte
   knoppen en links vangen ze op. Zo blijft doorbladeren werken én zijn
   'Deel je kaart', 'opnieuw' en de slotlinks gewoon aanklikbaar. */
.card.on a,.card.on button{pointer-events:auto}
/* Doorlopend routeprofiel: één lang profiel dat over alle kaarten heen schuift */
.profile{position:absolute;left:0;right:0;bottom:0;height:152px;overflow:hidden;z-index:1;pointer-events:none}
.profile-track{position:absolute;bottom:0;left:0;transition:transform .8s cubic-bezier(.35,.05,.15,1)}
.profile-art{animation:drift 8.5s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(28px)}}
.profile svg{display:block}
.route-road{stroke:var(--muted);stroke-width:2;stroke-dasharray:20 22;opacity:.5;
  animation:rdash 1.1s linear infinite}
@keyframes rdash{to{stroke-dashoffset:-42}}
/* voortgangs-segmenten */
.bars{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;
  display:flex;gap:5px;z-index:6}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:var(--accent)}
.bars i.done b{width:100%}
.bars i.cur b{animation:fill .1s linear forwards}
@keyframes fill{to{width:100%}}
/* tik-zones */
.zone{position:absolute;top:0;bottom:0;width:38%;z-index:5}

.zone.l{left:0}.zone.r{right:0;width:62%}
/* content */
.kicker{color:var(--accent);font-weight:800;font-size:14px;letter-spacing:.14em;
  text-transform:uppercase}
.big{font-size:88px;line-height:.95;font-weight:900;letter-spacing:-.03em}
.unit{color:var(--muted);font-size:20px;font-weight:700;margin-top:-4px}
.label{font-size:17px;color:var(--txt);max-width:22ch;line-height:1.4}
.quote{position:absolute;bottom:calc(74px + env(safe-area-inset-bottom));left:26px;right:26px;
  color:var(--muted);font-style:italic;font-size:14px}
.card.on .anim{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.card.on .anim2{animation:pop .5s .12s cubic-bezier(.2,.8,.2,1) both}
.card.on .anim3{animation:pop .5s .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
/* intro */
.logo{width:230px;max-width:74%;background:#fff;border-radius:16px;padding:16px 18px}
.title{font-size:46px;font-weight:900;line-height:1.02;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:18px}
/* duo */
.duo{display:flex;flex-direction:column;gap:16px;width:100%;max-width:340px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}
.tile .t-big{font-size:52px;font-weight:900;line-height:1}
.tile .t-lab{color:var(--muted);font-size:14px;margin-top:6px}
/* rider */
.rcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:22px;width:100%;max-width:340px}
.rname{font-size:26px;font-weight:900;margin:4px 0}
.rteam{color:var(--muted);font-size:14px}
.rbig{font-size:60px;font-weight:900;color:var(--accent);margin-top:10px;line-height:1}
/* list */
.items{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:8px;
  width:100%;max-width:340px}
.items li{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-weight:700;color:var(--txt)}
/* badge */
.badge-emoji{font-size:96px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.5))}
.badge-name{font-size:40px;font-weight:900}
.badge-desc{color:var(--muted);font-size:17px;max-width:24ch;line-height:1.4}
/* graph */
.chart{width:100%;max-width:360px}
.chart svg{width:100%;height:auto;display:block}
.g-grid{stroke:var(--line);stroke-width:1}.g-lbl{fill:var(--muted);font-size:11px}
.g-line{fill:none;stroke:var(--accent);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.g-dot{fill:var(--accent)}.g-val{fill:var(--txt);font-size:14px;font-weight:800}
/* closer links */
.clinks{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:8px}
.clink{display:block;background:var(--accent);color:#141414;text-decoration:none;font-weight:800;
  padding:15px;border-radius:14px;font-size:16px}
.clink.sec{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
.restart{background:none;border:none;color:var(--muted);text-decoration:underline;
  font-size:13px;margin-top:16px;cursor:pointer}
/* deelbare kaart */
.sharecard{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
  border-radius:22px;padding:20px 20px 18px;width:100%;max-width:340px;
  box-shadow:0 20px 50px rgba(0,0,0,.5);text-align:center}
.sc-top{display:flex;flex-direction:column;align-items:center;gap:9px;margin-bottom:12px}
.sc-top img{height:46px;background:#fff;border-radius:10px;padding:6px 11px}
.sc-top span{color:var(--accent);font-weight:800;font-size:17px;line-height:1.15;
  letter-spacing:.03em;text-align:center}
.sc-name{font-size:20px;font-weight:800}
.sc-pos{font-size:66px;font-weight:900;line-height:1;color:var(--accent)}
.sc-pos span{font-size:24px}
.sc-lab{color:var(--muted);font-size:14px}
.sc-persona{font-weight:800;font-size:16px;margin:8px 0 2px}
.sc-uni{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.sc-uni-h{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px}
.sc-uni-row{font-size:14px;font-weight:700;padding:2px 4px;text-align:center}
.sc-uni-row span{color:var(--accent)}
/* teamlijst */
.teamlist{list-style:none;padding:0;margin:8px 0 0;width:100%;max-width:380px;
  column-count:2;column-gap:16px}
.teamlist.single{column-count:1;max-width:330px}
.teamlist.single li{font-size:14px;padding:4px 0}
.teamlist.single .tl-nm{white-space:normal;overflow:visible}
.teamlist li{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:12.5px;break-inside:avoid}
.tl-rank{color:var(--muted);width:18px;text-align:right;font-variant-numeric:tabular-nums;flex:0 0 auto}
.tl-nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tl-pts{color:var(--accent);font-weight:800;font-variant-numeric:tabular-nums;flex:0 0 auto}
.tl-tag{font-size:8.5px;padding:1px 4px;border-radius:4px;font-weight:800;flex:0 0 auto}
.tl-tag.b{background:rgba(246,212,23,.2);color:var(--accent)}
.tl-tag.r{background:var(--panel2);color:var(--muted)}
.tl-sub{color:var(--muted);font-size:13px;margin-top:4px;max-width:26ch}
.tagtext{font-size:34px;font-weight:900;line-height:1.15;max-width:15ch}
.roast{font-size:30px;font-weight:900;line-height:1.22;max-width:17ch;font-style:italic}
/* confetti */
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;opacity:.9;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg);opacity:1}}
.hint{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:0;right:0;
  color:var(--muted);font-size:12px;opacity:.7}
.sndbtn{position:absolute;top:calc(18px + env(safe-area-inset-top));right:14px;z-index:8;
  width:42px;height:42px;border-radius:999px;border:none;background:rgba(255,255,255,.12);
  color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.snd-note{color:var(--accent);font-weight:800;font-size:15px;margin-top:16px;line-height:1.35;
  max-width:20ch}
/* review: code-badge per kaart + verkenningsbrief */
.codetag{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:14px;z-index:7;
  background:var(--accent);color:#141414;font-weight:900;font-size:13px;padding:3px 9px;
  border-radius:8px;letter-spacing:.06em}
.letterwrap{background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:22px 20px;width:100%;max-width:360px;text-align:left;max-height:68vh;overflow-y:auto}
.letter-h{font-size:26px;font-weight:900;margin-bottom:12px}
.letter-p{color:var(--txt);font-size:15px;line-height:1.5;margin:0 0 11px}
.letter-p:last-child{margin-bottom:0;color:var(--accent);font-weight:700}
.letter-p b{color:var(--accent)}

/* --- E-mailhek: kies je persoonlijke Wrapped --- */
.gate{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;
  flex-direction:column;justify-content:center;align-items:center;text-align:center;
  gap:13px;padding:calc(46px + env(safe-area-inset-top)) 26px 40px}
.gate .glogo{width:200px;max-width:68%;background:#fff;border-radius:16px;padding:14px 16px}
.gtitle{font-size:32px;font-weight:900;letter-spacing:-.02em}
.gsub{color:var(--muted);font-size:15px;max-width:27ch;line-height:1.45}
.gform{display:flex;flex-direction:column;gap:10px;width:100%;max-width:320px;margin-top:6px}
.ginput{padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);
  color:var(--txt);font-size:16px;text-align:center;outline:none}
.ginput:focus{border-color:var(--accent)}
.gsubmit{padding:14px;border:none;border-radius:12px;background:var(--accent);color:#141414;
  font-weight:800;font-size:16px;cursor:pointer}
.gerr{color:var(--red);font-size:14px;min-height:18px;max-width:30ch;line-height:1.35}
.gpick{display:flex;flex-direction:column;gap:8px;width:100%;max-width:320px}
.gbtn{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);
  color:var(--txt);font-weight:700;font-size:15px;cursor:pointer}
.gnote{color:var(--muted);font-size:12px;opacity:.8;max-width:28ch;line-height:1.4;margin-top:4px}

</style></head>
<body>
<div class="deck" id="deck">
  <audio id="bgm" src="../../../Tarantula.mp3" loop preload="auto"></audio>
  <div class="profile" id="profile"><div class="profile-track" id="ptrack"></div></div>
  <div class="bars" id="bars"></div>
  <button class="sndbtn" id="sndbtn" aria-label="Geluid aan/uit">🔊</button>
  <div class="zone l" id="zl"></div>
  <div class="zone r" id="zr"></div>
  <div class="gate" id="gate">
    <img class="glogo" id="glogo" alt="Bissusconi">
    <div class="gtitle">Bissusconi Wrapped</div>
    <div class="gsub">Vul je e-mailadres in om jouw persoonlijke Wrapped te bekijken.</div>
    <form id="gform" class="gform">
      <input id="gemail" type="email" inputmode="email" autocomplete="email"
        placeholder="jouw@email.nl" class="ginput">
      <button type="submit" class="gsubmit">Bekijk mijn Wrapped →</button>
    </form>
    <div class="gerr" id="gerr"></div>
    <div class="gpick" id="gpick"></div>
    <div class="gnote">Gebruik het e-mailadres waarmee je je hebt ingeschreven.</div>
  </div>
</div>

const deck = document.getElementById('deck');
let idx = 0;
// REVIEW-modus: toont een code-badge per kaart + de verkenningsbrief vooraan.
// De generator (render_wrapped_page) zet dit op false voor de echte wrapped.
const REVIEW = false;
function toCode(i){let s='';i++;while(i>0){i--;s=String.fromCharCode(65+i%26)+s;i=Math.floor(i/26);}return s;}

let STEP = 0;
function srand(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function buildProfile(){
  const deckW = deck.clientWidth || 380;
  const n = CARDS.length, H = 152, seg = 60;
  STEP = Math.round(deckW * 0.6);
  const totalW = deckW + STEP*(n-1) + 220;
  const cols = Math.ceil(totalW/seg);
  const rnd = srand(20250714);
  const peaks=[]; let px=3;
  while(px<cols){ peaks.push([px + rnd()*2, 42+rnd()*82]); px += 4 + Math.floor(rnd()*6); }
  function bump(i){let m=0;for(const p of peaks){const d=(i-p[0])/2.5;m+=p[1]*Math.exp(-d*d);}return m;}
  const ridge=[];
  for(let i=0;i<=cols;i++){ const yy=H-(16+7*Math.sin(i*0.5)+bump(i)); ridge.push([i*seg, Math.max(8,yy)]); }
  function ridgeYat(x){ const i=Math.max(0,Math.min(ridge.length-2,Math.floor(x/seg)));
    const a=ridge[i],b=ridge[i+1]; const t=(x-a[0])/((b[0]-a[0])||1); return a[1]+(b[1]-a[1])*t; }
  const pstr=ridge.map(p=>'L'+p[0].toFixed(0)+','+p[1].toFixed(1)).join(' ');
  // Iets naar links doortrekken zodat de trage 'idle'-drift geen leegte toont.
  const fill='M-120,'+H+' L-120,'+ridge[0][1].toFixed(1)+' '+pstr+' L'+totalW+','+H+' Z';
  const outline='M-120,'+ridge[0][1].toFixed(1)+' '+pstr;
  // Start-vlag aan het begin, Eiffeltoren aan het eind — beide bovenop de gele lijn.
  const startX=Math.round(deckW*0.25), eiffelX=Math.min(totalW-30, (n-1)*STEP + deckW - 60);
  const gY=ridgeYat(startX);
  const startIcon=`<g transform="translate(${startX},${gY})">`
    +`<line x1="0" y1="0" x2="0" y2="-48" stroke="var(--accent)" stroke-width="3"/>`
    +`<path d="M0,-48 L28,-42 L0,-32 Z" fill="var(--red)"/>`
    +`<text x="-3" y="-54" fill="var(--accent)" font-size="12" font-weight="800">START</text></g>`;
  const eiffel=`<g transform="translate(${eiffelX},${ridgeYat(eiffelX).toFixed(1)})" fill="none" stroke="var(--accent)" stroke-width="2">`
    +`<path d="M-13,0 L-5,-30 L-2,-54 L-3,-68 L0,-76 L3,-68 L2,-54 L5,-30 L13,0"/>`
    +`<line x1="-8.5" y1="-17" x2="8.5" y2="-17"/><line x1="-5.5" y1="-32" x2="5.5" y2="-32"/>`
    +`<path d="M-10,0 Q0,-22 10,0"/>`
    +`<text x="0" y="-84" fill="var(--accent)" font-size="11" font-weight="800" text-anchor="middle">PARIJS</text></g>`;
  const svg=`<svg width="${totalW}" height="${H}" viewBox="0 0 ${totalW} ${H}">`
    +`<path d="${fill}" fill="var(--accent)" opacity="0.14"/>`
    +`<path d="${outline}" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0.35"/>`
    +`<line class="route-road" x1="0" y1="${H-4}" x2="${totalW}" y2="${H-4}"/>`
    +startIcon+eiffel+`</svg>`;
  document.getElementById('ptrack').innerHTML = `<div class="profile-art">${svg}</div>`;
}
function moveProfile(){ document.getElementById('ptrack').style.transform = `translateX(${-idx*STEP}px)`; }

function chartSVG(stages, ranks, npart, xkind){
  const pts=[]; for(let i=0;i<stages.length;i++){ if(ranks[i]!=null) pts.push({s:stages[i],v:ranks[i]}); }
  if(!pts.length) return '';
  const W=360,H=250,pl=30,pr=20,pt=18,pb=26,x0=pl,x1=W-pr,y0=pt,y1=H-pb,n=pts.length;
  const xa=i=>n<=1?(x0+x1)/2:x0+(x1-x0)*i/(n-1);
  const hi=Math.max(npart, ...pts.map(p=>p.v)); const ya=v=>y0+(y1-y0)*(v-1)/(hi-1);
  let grid='',yl=''; [1,Math.round(hi/2),hi].forEach(t=>{const y=ya(t).toFixed(1);
    grid+=`<line class="g-grid" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`;
    yl+=`<text class="g-lbl" x="${x0-5}" y="${(+y+4).toFixed(1)}" text-anchor="end">${t}</text>`;});
  let xl=''; const step=n<=12?1:Math.ceil(n/7);
  const xlab=v=> xkind==='year' ? ("'"+String(v).slice(-2)) : ("E"+v);
  pts.forEach((p,i)=>{if(i%step===0||i===n-1) xl+=`<text class="g-lbl" x="${xa(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${xlab(p.s)}</text>`;});
  const line=pts.map((p,i)=>`${xa(i).toFixed(1)},${ya(p.v).toFixed(1)}`).join(' ');
  let dots=''; pts.forEach((p,i)=>{const last=i===n-1;dots+=`<circle class="g-dot" cx="${xa(i).toFixed(1)}" cy="${ya(p.v).toFixed(1)}" r="${last?5:3}"/>`;});
  const lp=pts[n-1];
  const val=`<text class="g-val" x="${(xa(n-1)-3).toFixed(1)}" y="${(ya(lp.v)-10).toFixed(1)}" text-anchor="end">#${lp.v}</text>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}">${grid}${yl}${xl}<polyline class="g-line" points="${line}"/>${dots}${val}</svg></div>`;
}

function confetti(){
  const cols=['#f6d417','#36d399','#f87272','#3aa0ff','#ffffff'];
  let h='<div class="confetti">';
  for(let i=0;i<80;i++){const l=Math.random()*100,d=1.6+Math.random()*1.8,dl=Math.random()*.6,
    c=cols[i%cols.length];
    h+=`<i style="left:${l}%;background:${c};animation-duration:${d}s;animation-delay:${dl}s"></i>`;}
  return h+'</div>';
}

function render(c){
  let inner='', extra='';
  if(c.type==='intro'){
    inner=`<img class="logo anim" src="${LOGO}"><div class="title anim2">${c.title}</div><div class="sub anim3">${c.sub}</div>`
      +`<div class="snd-note anim3">🔊 Zet je geluid aan, want het is Départ Réel!</div>`;
  } else if(c.type==='letter'){
    inner=`<div class="letterwrap anim"><div class="letter-h">${c.title}</div>`
      +c.paras.map(p=>`<p class="letter-p">${p}</p>`).join('')+`</div>`;
  } else if(c.type==='stat'){
    if(/eindklass/i.test(c.kicker)) extra=confetti();
    inner=`<div class="kicker anim">${c.kicker}</div><div class="big anim2" data-num="${c.big}">${c.big}</div>`
      +(c.unit?`<div class="unit anim2">${c.unit}</div>`:'')
      +`<div class="label anim3">${c.label}</div>`;
  } else if(c.type==='duo'){
    inner=`<div class="kicker anim">${c.kicker}</div><div class="duo anim2">`
      +`<div class="tile"><div class="t-big">${c.a.big}</div><div class="t-lab">${c.a.lab}</div></div>`
      +`<div class="tile"><div class="t-big">${c.b.big}</div><div class="t-lab">${c.b.lab}</div></div></div>`;
  } else if(c.type==='rider'){
    inner=`<div class="kicker anim">${c.kicker}</div><div class="rcard anim2">`
      +`<div class="rname">${c.rider}</div><div class="rteam">${c.team||''}</div>`
      +`<div class="rbig" data-num="${c.big}">${c.big}</div><div class="rteam">${c.label}</div></div>`;
  } else if(c.type==='list'){
    inner=`<div class="kicker anim">${c.kicker}</div><div class="title anim2" style="font-size:32px">${c.title}</div>`
      +`<ul class="items anim3">`+c.items.map(x=>`<li>${x}</li>`).join('')+`</ul>`;
  } else if(c.type==='teamlist'){
    inner=`<div class="kicker anim">${c.kicker}</div>`
      +(c.subtitle?`<div class="tl-sub anim">${c.subtitle}</div>`:'')
      +`<ol class="teamlist${c.single?' single':''} anim2">`+c.rows.map(r=>`<li><span class="tl-rank">${r.rank}</span>`
        +`<span class="tl-nm">${r.name}</span>`
        +(r.tag?`<span class="tl-tag ${r.tagcls}">${r.tag}</span>`:'')
        +`<span class="tl-pts">${r.pts}</span></li>`).join('')+`</ol>`;
  } else if(c.type==='badge'){
    inner=`<div class="kicker anim">${c.kicker||'Jouw Bissusconi-type'}</div><div class="badge-emoji anim2">${c.emoji}</div>`
      +`<div class="badge-name anim2">${c.name}</div><div class="badge-desc anim3">${c.desc}</div>`;
  } else if(c.type==='graph'){
    inner=`<div class="kicker anim">${c.kicker}</div><div class="anim2">${chartSVG(c.stages,c.ranks,c.npart,'stage')}</div>`;
  } else if(c.type==='atgraph'){
    inner=`<div class="kicker anim">${c.kicker}</div><div class="anim2">${chartSVG(c.stages,c.ranks,c.npart,'year')}</div>`;
  } else if(c.type==='tagline'){
    inner=`<div class="kicker anim">${c.kicker}</div><div class="tagtext anim2">${c.text}</div>`;
  } else if(c.type==='quote'){
    inner=`<div class="kicker anim">${c.kicker}</div><div class="roast anim2">“${c.text}”</div>`;
  } else if(c.type==='share'){
    const uni=(c.unique||[]).map(u=>`<div class="sc-uni-row">${u.name} <span>(${u.pts}p)</span></div>`).join('');
    inner=`<div class="kicker anim">Deel je Wrapped</div>`
      +`<div class="sharecard anim2"><div class="sc-top"><img src="${LOGO}"><span>Bissusconi Tourpoule<br>Wrapped · ${c.year||''}</span></div>`
      +`<div class="sc-name">${c.name}</div><div class="sc-pos">${c.pos}<span>e</span></div>`
      +`<div class="sc-lab">van ${c.npart} · ${c.total} punten</div>`
      +`<div class="sc-persona">${c.emoji} ${c.persona}</div>`
      +(uni?`<div class="sc-uni"><div class="sc-uni-h">Jouw unieke puntenpakkers</div>${uni}</div>`:'')
      +`</div>`
      +`<button class="clink anim3" id="sharebtn" style="max-width:340px" onclick="deelKaart(this)">📲 Deel je kaart</button>`;
  } else if(c.type==='closer'){
    extra=confetti();
    inner=`<img class="logo anim" src="${LOGO}" style="width:150px"><div class="title anim2" style="font-size:34px">${c.title}</div>`
      +`<div class="sub anim2">${c.sub}</div><div class="clinks anim3">`
      +`<a class="clink" href="../onthulling/">🎬 De grote onthulling</a>`
      +`<a class="clink sec" href="../eindstand/">📊 De volledige eindstand</a></div>`
      +`<button class="restart anim3" onclick="idx=0;show();">Bekijk mijn Wrapped opnieuw</button>`;
  }
  return `<div class="card on">${extra}${inner}${REVIEW&&idx>0?`<div class="codetag">${toCode(idx-1)}</div>`:''}<div class="hint">tik rechts →</div></div>`;
}

function bars(){
  const b=document.getElementById('bars'); b.innerHTML='';
  CARDS.forEach((_,i)=>{const seg=document.createElement('i');
    if(i<idx) seg.className='done'; else if(i===idx) seg.className='cur';
    seg.innerHTML='<b></b>'; b.appendChild(seg);});
}
function countUp(el){
  const target=parseInt(el.dataset.num,10); if(isNaN(target)) return;
  const t0=performance.now(), dur=700;
  function step(t){const p=Math.min(1,(t-t0)/dur); el.textContent=Math.round(target*(1-Math.pow(1-p,3)));
    if(p<1) requestAnimationFrame(step); else el.textContent=el.dataset.num;}
  requestAnimationFrame(step);
}
/* ---------------------------------------------------------------------------
   Deel je kaart: de kaart wordt op een canvas getekend en als PNG doorgegeven
   aan het deelmenu van de telefoon (WhatsApp, Instagram, Berichten…).
   Kan het toestel geen bestanden delen, dan valt hij terug op downloaden.
--------------------------------------------------------------------------- */
function _tekenKaart(c){
  return new Promise(function(klaar){
    var uni=(c.unique||[]).slice(0,3);
    // Hoogte volgt de inhoud: zonder unieke puntenpakkers is de kaart korter,
    // anders blijft er een lap lege ruimte onderaan staan.
    var B=1080, H=980 + (uni.length ? 150 + uni.length*46 : 0);
    var x=document.createElement('canvas');
    x.width=B; x.height=H;
    var g=x.getContext('2d');
    var mid=B/2;

    g.fillStyle='#12151c'; g.fillRect(0,0,B,H);
    g.fillStyle='#171a21';
    var m=70, w=B-2*m, h=H-2*m, r=54;
    g.beginPath(); g.moveTo(m+r,m);
    g.arcTo(m+w,m,m+w,m+h,r); g.arcTo(m+w,m+h,m,m+h,r);
    g.arcTo(m,m+h,m,m,r); g.arcTo(m,m,m+w,m,r); g.closePath();
    g.fill(); g.strokeStyle='#2a2f3a'; g.lineWidth=3; g.stroke();

    var logo=new Image();
    logo.onload=function(){
      var lw=300, lh=lw*logo.height/logo.width, lx=mid-lw/2, ly=m+56;
      g.fillStyle='#fff';
      g.beginPath(); g.moveTo(lx-16+14,ly-12);
      g.arcTo(lx+lw+16,ly-12,lx+lw+16,ly+lh+12,14);
      g.arcTo(lx+lw+16,ly+lh+12,lx-16,ly+lh+12,14);
      g.arcTo(lx-16,ly+lh+12,lx-16,ly-12,14);
      g.arcTo(lx-16,ly-12,lx+lw+16,ly-12,14); g.closePath(); g.fill();
      g.drawImage(logo,lx,ly,lw,lh);

      var y=ly+lh+92;
      g.textAlign='center';
      g.fillStyle='#f6d417'; g.font='800 40px -apple-system,Arial,sans-serif';
      g.fillText('Bissusconi Tourpoule', mid, y);
      g.fillText('Wrapped · ' + (c.year || new Date().getFullYear()), mid, y+52);

      y+=150;
      g.fillStyle='#e8eaed'; g.font='800 52px -apple-system,Arial,sans-serif';
      g.fillText(c.name, mid, y);

      y+=190;
      g.fillStyle='#f6d417'; g.font='900 190px -apple-system,Arial,sans-serif';
      var pos=String(c.pos), br=g.measureText(pos).width;
      g.font='900 70px -apple-system,Arial,sans-serif';
      var be=g.measureText('e').width;
      g.textAlign='left';
      g.font='900 190px -apple-system,Arial,sans-serif';
      g.fillText(pos, mid-(br+be)/2, y);
      g.font='900 70px -apple-system,Arial,sans-serif';
      g.fillText('e', mid-(br+be)/2+br, y);
      g.textAlign='center';

      y+=64;
      g.fillStyle='#9aa3b2'; g.font='400 38px -apple-system,Arial,sans-serif';
      g.fillText('van ' + c.npart + ' · ' + c.total + ' punten', mid, y);

      y+=76;
      g.fillStyle='#e8eaed'; g.font='800 44px -apple-system,Arial,sans-serif';
      g.fillText((c.emoji ? c.emoji+' ' : '') + c.persona, mid, y);

      if(uni.length){
        y+=54;
        g.strokeStyle='#2a2f3a'; g.lineWidth=2;
        g.beginPath(); g.moveTo(m+70,y); g.lineTo(B-m-70,y); g.stroke();
        y+=52;
        g.fillStyle='#9aa3b2'; g.font='700 28px -apple-system,Arial,sans-serif';
        g.fillText('JOUW UNIEKE PUNTENPAKKERS', mid, y);
        y+=52;
        uni.forEach(function(u){
          g.font='700 34px -apple-system,Arial,sans-serif';
          var naam=u.name+'  ', pts='('+u.pts+'p)';
          var wn=g.measureText(naam).width;
          g.font='700 34px -apple-system,Arial,sans-serif';
          var wp=g.measureText(pts).width, start=mid-(wn+wp)/2;
          g.textAlign='left';
          g.fillStyle='#e8eaed'; g.fillText(naam, start, y);
          g.fillStyle='#f6d417'; g.fillText(pts, start+wn, y);
          g.textAlign='center';
          y+=46;
        });
      }
      x.toBlob(function(b){ klaar(b); }, 'image/png');
    };
    logo.onerror=function(){ x.toBlob(function(b){ klaar(b); }, 'image/png'); };
    logo.src=LOGO;
  });
}

function deelKaart(knop){
  var kaart=CARDS[idx];
  if(!kaart || kaart.type!=='share') return;
  var oud=knop.textContent;
  knop.textContent='⏳ Kaart maken…';
  _tekenKaart(kaart).then(function(blob){
    var naam='bissusconi-wrapped.png';
    var bestand=new File([blob], naam, {type:'image/png'});
    var tekst=kaart.name+' werd '+kaart.pos+'e van '+kaart.npart+
              ' in de Bissusconi Tourpoule.';
    if(navigator.canShare && navigator.canShare({files:[bestand]})){
      navigator.share({files:[bestand], title:'Mijn Bissusconi Wrapped', text:tekst})
        .catch(function(){})
        .then(function(){ knop.textContent=oud; });
      return;
    }
    // Geen bestandsdeling (meestal desktop): dan maar downloaden.
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=naam; document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    knop.textContent='✅ Kaart opgeslagen';
    setTimeout(function(){ knop.textContent=oud; }, 2500);
  }).catch(function(){
    knop.textContent='⚠️ Lukte niet — probeer opnieuw';
    setTimeout(function(){ knop.textContent=oud; }, 2500);
  });
}

function show(){
  document.querySelectorAll('.card').forEach(c=>c.remove());
  const html=render(CARDS[idx]);
  document.getElementById('zl').insertAdjacentHTML('beforebegin', html);
  if(idx>0){const h=document.querySelector('.hint'); if(h) h.remove();}
  bars();
  moveProfile();
  document.querySelectorAll('[data-num]').forEach(countUp);
}
function next(){ if(idx<CARDS.length-1){idx++;show();} }
function prev(){ if(idx>0){idx--;show();} }
document.getElementById('zr').onclick=next;
document.getElementById('zl').onclick=prev;
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')next();if(e.key==='ArrowLeft')prev();});
// Achtergrondmuziek (Tarantula). Browsers blokkeren autoplay met geluid tot
// de eerste tik — daarom starten we ook bij de eerste interactie.
const bgm=document.getElementById('bgm'); bgm.volume=0.45;
let sound=true;
function updSnd(){ bgm.muted=!sound; document.getElementById('sndbtn').textContent=sound?'🔊':'🔇';
  if(sound){ bgm.play().catch(()=>{}); } else { bgm.pause(); } }
document.getElementById('sndbtn').addEventListener('click',e=>{ e.stopPropagation(); sound=!sound; updSnd(); });
bgm.play().catch(()=>{});
document.addEventListener('pointerdown',function kick(){ if(sound) bgm.play().catch(()=>{}); document.removeEventListener('pointerdown',kick); });
let _rt; window.addEventListener('resize',()=>{clearTimeout(_rt);_rt=setTimeout(()=>{buildProfile();moveProfile();},200);});
// --- Wrapped-gate: haal jouw deck op met je e-mailadres (AES per persoon) ---
const GATE=document.getElementById('gate');
const GEMAIL=document.getElementById('gemail');
const GERR=document.getElementById('gerr');
const GPICK=document.getElementById('gpick');
document.getElementById('glogo').src=LOGO;
function gb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function sha256hex(str){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}
async function decBlob(email,blob){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(email),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:gb64(blob.salt),iterations:WRAPPED.iter,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:gb64(blob.iv)},key,gb64(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));}
function nmeFromCards(cards){const s=cards.find(c=>c.type==='share');if(s)return s.name;
  const i=cards.find(c=>c.type==='intro');return i?i.sub.split('\u00b7')[0].trim():'?';}
function launch(cards){CARDS=cards;idx=0;GATE.style.display='none';buildProfile();show();
  if(sound)bgm.play().catch(()=>{});}
async function submitEmail(){
  GERR.textContent='';GPICK.innerHTML='';
  const email=(GEMAIL.value||'').trim().toLowerCase();
  if(!email){GERR.textContent='Vul je e-mailadres in.';return;}
  let list=null;
  try{list=WRAPPED.blobs[await sha256hex('bissusconi-wrapped:'+email)];}catch(e){}
  if(!list){GERR.textContent='Geen Wrapped gevonden voor dit e-mailadres.';return;}
  const decks=[];
  for(const blob of list){try{decks.push(await decBlob(email,blob));}catch(e){}}
  if(!decks.length){GERR.textContent='Geen Wrapped gevonden voor dit e-mailadres.';return;}
  if(decks.length===1){launch(decks[0]);return;}
  GERR.textContent='Meerdere deelnemers op dit adres — kies wie jij bent:';
  decks.forEach(cards=>{const b=document.createElement('button');b.className='gbtn';
    b.textContent=nmeFromCards(cards);b.onclick=()=>launch(cards);GPICK.appendChild(b);});}
document.getElementById('gform').addEventListener('submit',e=>{e.preventDefault();submitEmail();});
buildProfile();
</script>
