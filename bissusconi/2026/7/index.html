<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --txt:#e8eaed; --muted:#9aa3b2;
    --accent:#ffd60a; --accent-ink:#ffd60a; --green:#36d399; --red:#f87272;
    --rank2:#cdd3dd; --rank3:#e0a878; --header-bg:rgba(15,17,21,.92); --radius:14px;
  }
  html[data-theme="light"]{
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#eceff3; --line:#dfe3e8;
    --txt:#1b1e25; --muted:#647080;
    --accent:#ffd60a; --accent-ink:#9a7400; --green:#1a7f4b; --red:#d23b3b;
    --rank2:#8a93a3; --rank3:#b5793b; --header-bg:rgba(245,246,248,.92);
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);overflow-x:hidden;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;background:var(--header-bg);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 16px 12px}
  .titlerow{display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;justify-content:center;position:relative;min-height:48px}
  .brand .iconbtn{position:absolute;right:0;margin:0}
  .brand .backbtn{position:absolute;left:0;right:auto;margin:0;text-decoration:none}
  h1{font-size:19px;margin:0;letter-spacing:.3px} h1 .dot{color:var(--accent-ink)}
  .iconbtn{margin-left:auto;flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;
    font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn:active{background:var(--line)}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .search{margin-top:10px;position:relative}
  .search input{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:16px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .tabs{display:flex;gap:14px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto;background:none;border:none;color:var(--muted);padding:8px 2px;
    font-size:15px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
  main{padding:14px 16px calc(60px + env(safe-area-inset-bottom));max-width:780px;margin:0 auto}
  .muted{color:var(--muted)} .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.wrap{white-space:normal;width:99%} .tm{color:var(--muted);font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .rank{color:var(--muted);width:40px;min-width:40px;text-align:center;padding-left:2px;padding-right:2px}
  .rank.top1{color:var(--accent-ink)} .rank.top2{color:var(--rank2)} .rank.top3{color:var(--rank3)}
  .jersey{display:inline-flex;vertical-align:middle;line-height:0}
  .jersey svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
  .mvcol{width:30px;min-width:30px;text-align:left;padding-left:2px;padding-right:2px}
  .mv{display:inline-block;font-size:10px;font-weight:700}
  .mv.up{color:var(--green)} .mv.down{color:var(--red)} .mv.flat{color:var(--muted)}
  .dop{font-size:12px;color:var(--muted);margin-top:2px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .pill.out{background:rgba(248,114,114,.15);color:var(--red);border-color:transparent}
  .abrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
  .abrow:last-child{border-bottom:none}
  .abrow .enr{font-size:11px;font-weight:700;color:var(--muted);min-width:24px}
  .abrow .abnm{flex:1} .abrow .tm{flex:0 0 auto;text-align:right}
  .logoplate{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 16px;display:inline-flex}
  .logo{display:block;height:85px;width:auto;max-width:100%}
  .meta-foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
  .linkrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:14px;margin-bottom:8px;color:var(--txt);text-decoration:none;font-size:16px}
  .linkrow .chev{margin-left:auto;color:var(--muted)}
  /* Subklassement */
  .sp-empty{text-align:center;padding:26px 14px}
  .sp-empty .ic{font-size:30px}
  .sp-empty .t{font-size:16px;font-weight:700;margin:10px 0 4px}
  .sp-empty .s{color:var(--muted);font-size:13px;line-height:1.5;max-width:320px;margin:0 auto 16px}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#1a1a1a;
    border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .btn:active{opacity:.85}
  .btn.ghost{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .sp-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .sp-chip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .sp-chip.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .sp-chip.add{padding:6px 10px}
  .sp-edit{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:2px;margin-bottom:12px}
  .seg button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;
    padding:6px 14px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--txt)}
  .sp-count{color:var(--muted);font-size:12px;margin:0 0 10px}
  .sp-list{max-height:44vh;max-height:44dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .sp-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);
    cursor:pointer;font-size:14px}
  .sp-item:last-child{border-bottom:none}
  .sp-item .box{width:19px;height:19px;flex:0 0 auto;border-radius:5px;border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:transparent;background:transparent}
  .sp-item.sel .box{background:var(--accent);border-color:var(--accent);color:#1a1a1a}
  .sp-field{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:16px;margin-bottom:10px}
  .sp-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .sp-actions .btn{flex:1;justify-content:center;min-width:120px}
  .sp-del{background:none;border:none;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;padding:10px 6px}
  .sp-toast{background:rgba(54,211,153,.14);border:1px solid transparent;color:var(--green);
    border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  /* Klassementsverloop-grafiek (klik op een naam in de tussenstand) */
  .backlink{display:inline-flex;align-items:center;gap:7px;background:none;border:none;
    color:var(--accent2-ink,var(--accent-ink));font-weight:600;font-size:15px;cursor:pointer;
    padding:6px 2px;margin:0 0 6px}
  .backlink .ar{font-size:19px;line-height:1}
  .dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:2px 0 10px}
  .dhead .nm{font-size:20px;font-weight:800}
  .dhead .pos{color:var(--muted);font-size:14px}
  .dhead .pos b{color:var(--txt)}
  .card.chartcard{padding:10px 10px 6px}
  .chartwrap{width:100%}
  .chartwrap svg{width:100%;height:auto;display:block}
  .chart-grid{stroke:var(--line);stroke-width:1}
  .chart-lbl{fill:var(--muted);font-size:12px;font-family:inherit}
  .chart-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .chart-dot{fill:var(--accent)}
  .chart-dot.last{stroke:var(--bg);stroke-width:2}
  .chart-val{fill:var(--txt);font-size:14px;font-weight:800;font-family:inherit}
</style>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const state = { tab:'tussenstand', q:'', detail:null, scrollY:0 };
const TABS = [
  {id:'tussenstand', label:'Tussenstand'},
  {id:'dagscore', label:'Dagscore'},
  {id:'uitslag', label:'Uitslag'},
  {id:'subklassement', label:'Subklassement'},
];
// --- Subklassement-state (eigen views, bewaard in de browser per jaar) ---
const SP_KEY = 'tp-subpoule:1:' + (D.year || 'x');
let spViews = [];          // [{id, name, members:[deelnemerId,...]}]
let spActive = null;       // id van de actieve view
let spSub = 'klassement';  // 'klassement' | 'dagscore'
let spEdit = null;         // null of {id, name, members:Set} tijdens bewerken
let spToast = '';          // eenmalige melding
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t==='light'?'light':'dark');
  const b=document.getElementById('themebtn'); if(b) b.textContent = t==='light'?'🌙':'☀️';
}
function toggleTheme(){
  const n = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  try{ localStorage.setItem('tp-theme', n); }catch(e){}
  applyTheme(n);
}
window.toggleTheme=toggleTheme;
function rankClass(r){ return r===1?'top1':r===2?'top2':r===3?'top3':''; }
function moveHtml(m){
  if(m==null) return '';
  if(m>0) return `<span class="mv up">▲${m}</span>`;
  if(m<0) return `<span class="mv down">▼${-m}</span>`;
  return `<span class="mv flat">–</span>`;
}
// Wielershirt-badge voor plek 1/2/3 (geel / groen / bolletjes), anders het kale nummer.
function jerseySvg(rank){
  const c = {
    1:{body:'#f6d417', num:'#4a3b00', dots:false},
    2:{body:'#1fa64a', num:'#ffffff', dots:false},
    3:{body:'#ffffff', num:'#333333', dots:true},
  }[rank];
  const dots = c.dots ? `<g fill="#e0241f">`
    + `<circle cx="16" cy="10.5" r="1.4"/><circle cx="24" cy="10.5" r="1.4"/>`
    + `<circle cx="6" cy="12" r="1.3"/><circle cx="34" cy="12" r="1.3"/>`
    + `<circle cx="12.5" cy="18.5" r="1.4"/><circle cx="27.5" cy="18.5" r="1.4"/>`
    + `<circle cx="15" cy="26.5" r="1.4"/><circle cx="20" cy="28.5" r="1.3"/><circle cx="25" cy="26.5" r="1.4"/>`
    + `</g>` : '';
  return `<span class="jersey"><svg viewBox="0 0 40 34" width="34" height="29" aria-hidden="true">`
    + `<path d="M13 3 L16 3 C18 7 22 7 24 3 L27 3 L38 9 L33 17 L29 14.5 L29 31 L11 31 L11 14.5 L7 17 L2 9 Z" `
    + `fill="${c.body}" stroke="rgba(0,0,0,.22)" stroke-width="1" stroke-linejoin="round"/>`
    + dots
    + `<text x="20" y="23" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" `
    + `font-size="17" font-weight="800" fill="${c.num}">${rank}</text></svg></span>`;
}
function rankBadge(rank){ return (rank>=1 && rank<=3) ? jerseySvg(rank) : String(rank); }
function abandonsHtml(){
  if(!D.abandons || !D.abandons.length)
    return `<div class="card"><span class="muted">Geen nieuwe uitvallers.</span></div>`;
  return `<div class="card"><div class="muted" style="margin-bottom:6px">Nieuwe uitvallers (deze + vorige etappe)</div>${
    D.abandons.map(a=>`<div class="abrow"><span class="pill out">${esc(a.type)}</span><span class="enr">E${a.stage}</span><span class="abnm">${esc(a.name)}</span><span class="tm">${esc(a.team)}</span></div>`).join('')
  }</div>`;
}
function setTab(t){ state.tab=t; state.detail=null; if(t!=='subklassement') spEdit=null; render(); } window.setTab=setTab;
document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value; render(); });

// ---------- Subklassement ----------
function spLoad(){
  try{ const raw=localStorage.getItem(SP_KEY); if(raw){ const o=JSON.parse(raw); spViews=o.views||[]; spActive=o.active||null; } }catch(e){ spViews=[]; }
  if(spActive && !spViews.some(v=>v.id===spActive)) spActive=null;
  if(!spActive && spViews.length) spActive=spViews[0].id;
}
function spSave(){ try{ localStorage.setItem(SP_KEY, JSON.stringify({views:spViews, active:spActive})); }catch(e){} }
function spId(){ return 'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function spRoster(){ return D.standings.map(r=>({id:r.id,name:r.name})).sort((a,b)=>a.name.localeCompare(b.name,'nl')); }
function rankBy(arr, key){
  const s=[...arr].sort((a,b)=>b[key]-a[key]);
  const rankOf={}; let pv=null, pr=0;
  s.forEach((o,i)=>{ const r=(pv!==null && o[key]===pv)?pr:i+1; rankOf[o.id]=r; pv=o[key]; pr=r; });
  return rankOf;
}
function subStandings(mset){
  const rows=D.standings.filter(r=>mset.has(r.id)).map(r=>({id:r.id,name:r.name,dag:r.dag,total:r.total,pt:r.pt}));
  const cur=rankBy(rows,'total');
  const withPt=rows.filter(r=>r.pt!=null);
  const prev=rankBy(withPt,'pt');
  return rows.map(r=>({...r, rank:cur[r.id], move:(r.pt!=null && prev[r.id]!=null)?(prev[r.id]-cur[r.id]):null}))
             .sort((a,b)=>a.rank-b.rank || a.name.localeCompare(b.name,'nl'));
}
function subDagscore(mset){
  const byId={}; D.dagscore.forEach(r=>byId[r.id]=r);
  const rows=[...mset].map(id=>{ const b=D.standings.find(s=>s.id===id); const d=byId[id];
     return {id, name:b?b.name:'?', score:d?d.score:0}; });
  const cur=rankBy(rows,'score');
  return rows.map(r=>({...r, rank:cur[r.id]})).sort((a,b)=>a.rank-b.rank || a.name.localeCompare(b.name,'nl'));
}
function subKlasTable(mset){
  const rows=subStandings(mset);
  return `<table><thead><tr><th class="rank">#</th><th class="mvcol"></th><th>Deelnemer</th><th class="num">Dag</th><th class="num">Totaal</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="rank ${rankClass(r.rank)}">${rankBadge(r.rank)}</td><td class="mvcol">${moveHtml(r.move)}</td><td class="wrap"><b>${esc(r.name)}</b></td><td class="num">${r.dag}</td><td class="num"><b>${r.total}</b></td></tr>`).join('')
  }</tbody></table>`;
}
function subDagTable(mset){
  if(!D.dagscore.length) return `<div class="empty">Nog geen dagscore voor deze etappe.</div>`;
  const rows=subDagscore(mset);
  return `<table><thead><tr><th class="rank">#</th><th>Deelnemer</th><th class="num">Punten</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="rank ${rankClass(r.rank)}">${rankBadge(r.rank)}</td><td class="wrap"><b>${esc(r.name)}</b></td><td class="num">${r.score}</td></tr>`).join('')
  }</tbody></table>`;
}
function spEditorHtml(){
  const sel=spEdit.members;
  const items=spRoster().map(p=>`<div class="sp-item ${sel.has(p.id)?'sel':''}" data-id="${p.id}" data-n="${esc(norm(p.name))}" onclick="spToggle(this)"><span class="box">&#10003;</span><span>${esc(p.name)}</span></div>`).join('');
  return `<div class="card">
    <input class="sp-field" id="spName" type="text" placeholder="Naam van je subklassement" value="${esc(spEdit.name)}" maxlength="40">
    <div class="search" style="margin-top:0;margin-bottom:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><input class="sp-field" id="spSearch" type="search" placeholder="Zoek deelnemer…" style="margin-bottom:0;padding-left:40px" oninput="spFilter(this.value)"></div>
    <div class="sp-count" id="spCount">${sel.size} gekozen</div>
    <div class="sp-list" id="spList">${items}</div>
    <div class="sp-actions">
      <button class="btn" onclick="spSaveEdit()">Opslaan</button>
      <button class="btn ghost" onclick="spCancel()">Annuleren</button>
      ${spEdit.id?'<button class="sp-del" onclick="spDeleteEdit()">Verwijderen</button>':''}
    </div>
  </div>`;
}
function tSubklassement(){
  let html='';
  if(spToast){ html+=`<div class="sp-toast">${esc(spToast)}</div>`; spToast=''; }
  if(spEdit) return html + spEditorHtml();
  if(!spViews.length){
    return html + `<div class="card"><div class="sp-empty">
      <div class="ic">👥</div>
      <div class="t">Maak je eigen subklassement</div>
      <div class="s">Kies bijvoorbeeld je familie of vrienden en volg hun onderlinge strijd. Je keuze wordt op dit apparaat bewaard.</div>
      <button class="btn" onclick="spNew()">➕ Maak een subklassement</button>
    </div></div>`;
  }
  const v=spViews.find(x=>x.id===spActive) || spViews[0];
  spActive=v.id;
  const chips=spViews.map(x=>`<button class="sp-chip ${x.id===v.id?'on':''}" onclick="spSelect('${x.id}')">${esc(x.name)}</button>`).join('')
    + `<button class="sp-chip add" onclick="spNew()" aria-label="Nieuw subklassement">➕</button>`
    + `<button class="sp-edit" onclick="spEditView('${v.id}')" aria-label="Bewerk subklassement">✏️</button>`;
  const mset=new Set(v.members);
  const seg=`<div class="seg"><button class="${spSub==='klassement'?'on':''}" onclick="spSetSub('klassement')">Klassement</button><button class="${spSub==='dagscore'?'on':''}" onclick="spSetSub('dagscore')">Dagscore</button></div>`;
  let body;
  if(!v.members.length){ body=`<div class="empty">Nog geen deelnemers gekozen. Tik op ✏️ om je subpoule samen te stellen.</div>`; }
  else { body = (spSub==='dagscore') ? subDagTable(mset) : subKlasTable(mset); }
  const share=v.members.length?`<div style="margin-top:12px"><button class="btn ghost" onclick="spShare('${v.id}')">🔗 Deel dit subklassement</button></div>`:'';
  return html + `<div class="sp-chips">${chips}</div>${seg}<div class="card"><div class="tw">${body}</div></div>${share}`;
}
function spSelect(id){ spActive=id; spSave(); render(); }
function spSetSub(s){ spSub=s; render(); }
function spNew(){ spEdit={id:null, name:'', members:new Set()}; render(); }
function spEditView(id){ const v=spViews.find(x=>x.id===id); if(!v)return; spEdit={id:v.id, name:v.name, members:new Set(v.members)}; render(); }
function spToggle(el){
  const id=parseInt(el.getAttribute('data-id'),10);
  if(spEdit.members.has(id)){ spEdit.members.delete(id); el.classList.remove('sel'); }
  else { spEdit.members.add(id); el.classList.add('sel'); }
  const c=document.getElementById('spCount'); if(c){ c.textContent=spEdit.members.size+' gekozen'; c.style.color=''; }
}
function spFilter(q){
  const nq=norm(q);
  document.querySelectorAll('#spList .sp-item').forEach(el=>{
    el.style.display=(!nq || el.getAttribute('data-n').includes(nq))?'':'none';
  });
}
function spSaveEdit(){
  const nameEl=document.getElementById('spName'); const name=(nameEl.value||'').trim();
  if(!name){ nameEl.focus(); return; }
  if(!spEdit.members.size){ const c=document.getElementById('spCount'); if(c){ c.textContent='Kies minstens één deelnemer'; c.style.color='var(--red)'; } return; }
  const members=[...spEdit.members];
  if(spEdit.id){ const v=spViews.find(x=>x.id===spEdit.id); if(v){ v.name=name; v.members=members; } spActive=spEdit.id; }
  else { const id=spId(); spViews.push({id, name, members}); spActive=id; }
  spEdit=null; spSave(); render();
}
function spCancel(){ spEdit=null; render(); }
function spDeleteEdit(){
  if(spEdit.id){ spViews=spViews.filter(x=>x.id!==spEdit.id); if(spActive===spEdit.id) spActive=spViews.length?spViews[0].id:null; }
  spEdit=null; spSave(); render();
}
function spEncode(v){ return btoa(unescape(encodeURIComponent(JSON.stringify({n:v.name, m:v.members})))); }
function spDecode(s){ try{ return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch(e){ return null; } }
function spShare(id){
  const v=spViews.find(x=>x.id===id); if(!v)return;
  const url=location.origin+location.pathname+'#sub='+spEncode(v);
  if(navigator.share){ navigator.share({title:'Subklassement '+v.name, url}).catch(()=>{}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>{ spToast='Deel-link gekopieerd naar klembord.'; render(); },
                                            ()=>{ window.prompt('Kopieer de link:', url); });
  } else { window.prompt('Kopieer de link:', url); }
}
function spImportFromHash(){
  const m=(location.hash||'').match(/sub=([^&]+)/);
  if(!m) return;
  const o=spDecode(m[1]);
  try{ history.replaceState(null,'', location.pathname+location.search); }catch(e){}
  if(!o || !o.n || !Array.isArray(o.m)) return;
  const members=o.m.filter(x=>typeof x==='number');
  // Al aanwezig (zelfde leden)? Dan niet dupliceren, maar activeren — zo maakt
  // een reload met dezelfde link geen kopie als de hash niet gewist kon worden.
  const key=[...members].sort((a,b)=>a-b).join(',');
  const same=spViews.find(v=>[...v.members].sort((a,b)=>a-b).join(',')===key);
  if(same){ spActive=same.id; spSave(); state.tab='subklassement'; return; }
  let name=String(o.n).slice(0,40);
  if(spViews.some(v=>v.name===name)){ let i=2; while(spViews.some(v=>v.name===name+' ('+i+')')) i++; name=name+' ('+i+')'; }
  const id=spId();
  spViews.push({id, name, members});
  spActive=id; spSave();
  spToast='Subklassement “'+name+'” toegevoegd.';
  state.tab='subklassement';
}
window.spNew=spNew; window.spSelect=spSelect; window.spSetSub=spSetSub; window.spEditView=spEditView;
window.spToggle=spToggle; window.spFilter=spFilter; window.spSaveEdit=spSaveEdit; window.spCancel=spCancel;
window.spDeleteEdit=spDeleteEdit; window.spShare=spShare;

function tTussenstand(q){
  const rows = D.standings.filter(r=>!q||norm(r.name).includes(q));
  if(!rows.length) return `<div class="empty">Geen deelnemer gevonden.</div>`;
  return `<div class="card"><div class="tw"><table><thead><tr><th class="rank">#</th><th class="mvcol"></th><th>Deelnemer</th><th class="num">Dag</th><th class="num">Totaal</th></tr></thead><tbody>${
    rows.map(r=>`<tr onclick="openDetail(${r.id})"><td class="rank ${rankClass(r.rank)}">${rankBadge(r.rank)}</td><td class="mvcol">${moveHtml(r.move)}</td><td class="wrap"><b>${esc(r.name)}</b></td><td class="num">${r.dag}</td><td class="num"><b>${r.total}</b></td></tr>`).join('')
  }</tbody></table></div></div>`;
}
// ---------- Klassementsverloop (detailgrafiek per deelnemer) ----------
function openDetail(id){ state.scrollY = window.scrollY; state.detail = id; render(); window.scrollTo({top:0}); }
window.openDetail=openDetail;
function closeDetail(){ const y=state.scrollY||0; state.detail=null; render(); window.scrollTo({top:y}); }
window.closeDetail=closeDetail;

// Tekent het positieverloop als SVG met expliciete pixelafmetingen W×H,
// zodat de grafiek het beschikbare scherm zo hoog mogelijk vult.
function chartSvg(hist, W, H){
  const stages = D.histStages||[];
  const r = hist.r||[];
  const pts = [];
  for(let i=0;i<stages.length;i++){ if(r[i]!=null) pts.push({s:stages[i], v:r[i]}); }
  if(pts.length===0) return `<div class="empty">Nog geen gegevens.</div>`;

  const padL=34, padR=22, padT=22, padB=30;
  const x0=padL, x1=W-padR, y0=padT, y1=H-padB;
  const n=pts.length;
  const xAt = i => n<=1 ? (x0+x1)/2 : x0 + (x1-x0)*i/(n-1);

  // Positie: 1 bovenaan (omgekeerde as), laatste plek onderaan.
  const maxRank = Math.max(D.standings.length, ...pts.map(p=>p.v));
  const lo=1, hi=Math.max(maxRank,2);
  const yAt = v => y0 + (y1-y0)*(v-lo)/(hi-lo);

  // Gridlijnen op enkele posities (1, kwarten, laatste).
  const ticks=[1];
  [0.25,0.5,0.75].forEach(f=>{ const t=Math.round(1+(hi-1)*f); if(t>1&&t<hi&&!ticks.includes(t)) ticks.push(t); });
  ticks.push(hi);
  let grid='', ylab='';
  ticks.forEach(t=>{ const y=yAt(t).toFixed(1);
    grid += `<line class="chart-grid" x1="${x0}" y1="${y}" x2="${x1}" y2="${y}"/>`;
    ylab += `<text class="chart-lbl" x="${x0-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${t}</text>`;
  });

  // X-labels (bij weinig etappes allemaal, anders gespreid).
  const step = n<=12 ? 1 : Math.ceil(n/9);
  let xlab='';
  pts.forEach((p,i)=>{ if(i%step===0 || i===n-1){
    xlab += `<text class="chart-lbl" x="${xAt(i).toFixed(1)}" y="${H-9}" text-anchor="middle">E${p.s}</text>`;
  }});

  const line = pts.map((p,i)=>`${xAt(i).toFixed(1)},${yAt(p.v).toFixed(1)}`).join(' ');
  let dots='';
  pts.forEach((p,i)=>{ const last=i===n-1;
    dots += `<circle class="chart-dot${last?' last':''}" cx="${xAt(i).toFixed(1)}" cy="${yAt(p.v).toFixed(1)}" r="${last?5:3.2}"/>`;
  });
  // Waarde-label (#positie) bij het laatste punt.
  const lp=pts[n-1], lx=xAt(n-1), ly=yAt(lp.v);
  const vy = lp.v>hi*0.6 ? ly-11 : ly+19;
  const vAnchor = n<=1 ? 'middle' : 'end';
  const val = `<text class="chart-val" x="${(lx-(n<=1?0:3)).toFixed(1)}" y="${vy.toFixed(1)}" text-anchor="${vAnchor}">#${lp.v}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Positieverloop">`
    + grid + ylab + xlab
    + `<polyline class="chart-line" points="${line}"/>` + dots + val
    + `</svg>`;
}

// Meet de beschikbare hoogte en teken de grafiek beeldvullend.
function drawDetailChart(){
  const box=document.getElementById('chartbox'); if(!box) return;
  const p=D.standings.find(s=>s.id===state.detail); if(!p) return;
  const hist=D.history[String(p.id)]||{r:[]};
  const rect=box.getBoundingClientRect();
  const W=Math.max(240, Math.round(box.clientWidth));
  // Vul tot onderaan het scherm; laat wat ruimte voor de kaartrand + veilige zone.
  const avail=window.innerHeight - rect.top - 22;
  const H=Math.max(300, Math.round(avail));
  box.innerHTML=chartSvg(hist, W, H);
}

function tDetail(){
  const id=state.detail;
  const p=D.standings.find(s=>s.id===id);
  if(!p){ state.detail=null; return tTussenstand(''); }
  const back=`<button class="backlink" onclick="closeDetail()"><span class="ar">←</span>Terug</button>`;
  const head=`<div class="dhead"><span class="nm">${esc(p.name)}</span>`
    + `<span class="pos">nu <b>${rankBadge(p.rank)}</b> · ${p.total} punten</span></div>`;
  return `<div class="detail">${back}${head}`
    + `<div class="card chartcard"><div class="chartwrap" id="chartbox"></div></div></div>`;
}
function tDagscore(q){
  const rows = D.dagscore.filter(r=>!q||norm(r.name).includes(q));
  if(!D.dagscore.length) return `<div class="empty">Geen dagscores voor deze etappe.</div>`;
  if(!rows.length) return `<div class="empty">Geen deelnemer gevonden.</div>`;
  return `<div class="card"><div class="tw"><table><thead><tr><th class="rank">#</th><th>Deelnemer</th><th class="num">Punten</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="rank ${rankClass(r.rank)}">${rankBadge(r.rank)}</td><td class="wrap"><b>${esc(r.name)}</b>${r.doping?`<div class="dop">Doping: ${esc(r.doping)}</div>`:''}</td><td class="num">${r.score}</td></tr>`).join('')
  }</tbody></table></div></div>`;
}
function tUitslag(q){
  const rows = D.results.filter(r=>!q||norm(r.rider).includes(q)||norm(r.team).includes(q));
  const table = rows.length
    ? `<div class="card"><div class="tw"><table><thead><tr><th class="rank">#</th><th>Renner</th><th class="num">Punten</th></tr></thead><tbody>${
        rows.map(r=>`<tr><td class="rank">${r.rank}</td><td class="wrap">${esc(r.rider)}<div class="tm">${esc(r.team)}</div></td><td class="num">${r.points}</td></tr>`).join('')
      }</tbody></table></div></div>`
    : `<div class="empty">Geen renner gevonden.</div>`;
  return table + abandonsHtml();
}
function render(){
  const tabsEl=document.getElementById('tabs');
  const sb=document.querySelector('header .search');
  // Detailgrafiek: eigen 'pagina' zonder tabs en zonder zoekbalk.
  if(state.detail!=null){
    tabsEl.innerHTML='';
    if(sb) sb.style.display='none';
    document.getElementById('app').innerHTML = tDetail();
    requestAnimationFrame(drawDetailChart);
    return;
  }
  tabsEl.innerHTML = TABS.map(t=>
    `<button class="${t.id===state.tab?'on':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('');
  // Actieve tab in beeld schuiven (op smalle schermen passen niet alle tabs).
  const onT=document.querySelector('#tabs button.on'); if(onT) onT.scrollIntoView({inline:'nearest', block:'nearest'});
  // De zoekbalk bovenaan is niet van toepassing op het subklassement (dat heeft z'n eigen zoekveld).
  if(sb) sb.style.display=(state.tab==='subklassement')?'none':'';
  const q=norm(state.q);
  let html = state.tab==='dagscore'?tDagscore(q)
           : state.tab==='uitslag'?tUitslag(q)
           : state.tab==='subklassement'?tSubklassement()
           : tTussenstand(q);
  document.getElementById('app').innerHTML = html + `<div class="meta-foot">Bijgewerkt: ${esc(D.generated_at)}</div>`;
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'dark');
window.addEventListener('resize', ()=>{ if(state.detail!=null) drawDetailChart(); });
spLoad();
spImportFromHash();
render();
</script>
