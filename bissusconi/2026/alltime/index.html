<script>try{var _t=localStorage.getItem('tp-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --txt:#e8eaed; --muted:#9aa3b2;
    --accent:#ffd60a; --accent-ink:#ffd60a; --green:#36d399; --red:#f87272;
    --rank2:#cdd3dd; --rank3:#e0a878; --header-bg:rgba(15,17,21,.92); --radius:14px;
  }
  html[data-theme="light"]{
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#eceff3; --line:#dfe3e8;
    --txt:#1b1e25; --muted:#647080;
    --accent:#ffd60a; --accent-ink:#9a7400; --green:#1a7f4b; --red:#d23b3b;
    --rank2:#8a93a3; --rank3:#b5793b; --header-bg:rgba(245,246,248,.92);
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);overflow-x:hidden;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;background:var(--header-bg);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 16px 12px}
  .titlerow{display:flex;align-items:center;gap:10px}
  .brand{display:flex;align-items:center;justify-content:center;position:relative;min-height:48px}
  .brand .iconbtn{position:absolute;right:0;margin:0}
  .brand .backbtn{position:absolute;left:0;right:auto;margin:0;text-decoration:none}
  h1{font-size:19px;margin:0;letter-spacing:.3px} h1 .dot{color:var(--accent-ink)}
  .iconbtn{margin-left:auto;flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;
    font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn:active{background:var(--line)}
  .sub{color:var(--txt);text-align:center;font-size:16px;margin-top:4px;font-weight:bold}
  html[data-theme="light"] .sub{color:#0d0e10}
  .sub .at-count{display:block;font-weight:400;font-size:14px;margin-top:2px}
  .search{margin-bottom:12px;position:relative}
  .search input{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:16px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  .tabs{display:flex;gap:14px;margin-top:10px;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs button{flex:0 0 auto;background:none;border:none;color:var(--muted);padding:8px 2px;
    font-size:15px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
  main{padding:14px 16px calc(60px + env(safe-area-inset-bottom));max-width:780px;margin:0 auto}
  .muted{color:var(--muted)} .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.wrap{white-space:normal;width:99%} .tm{color:var(--muted);font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .rank{color:var(--muted);width:40px;min-width:40px;text-align:center;padding-left:2px;padding-right:2px}
  .rank.top1{color:var(--accent-ink)} .rank.top2{color:var(--rank2)} .rank.top3{color:var(--rank3)}
  .jersey{display:inline-flex;vertical-align:middle;line-height:0}
  .jersey svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
  .mvcol{width:30px;min-width:30px;text-align:left;padding-left:2px;padding-right:2px}
  .mv{display:inline-block;font-size:10px;font-weight:700}
  .mv.up{color:var(--green)} .mv.down{color:var(--red)} .mv.flat{color:var(--muted)}
  .dop{font-size:12px;color:var(--muted);margin-top:2px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .pill.out{background:rgba(248,114,114,.15);color:var(--red);border-color:transparent}
  .abrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
  .abrow:last-child{border-bottom:none}
  .abrow .enr{font-size:11px;font-weight:700;color:var(--muted);min-width:24px}
  .abrow .abnm{flex:1} .abrow .tm{flex:0 0 auto;text-align:right}
  .logoplate{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 16px;display:inline-flex}
  .logo{display:block;height:85px;width:auto;max-width:100%}
  .meta-foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
  .linkrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:14px;margin-bottom:8px;color:var(--txt);text-decoration:none;font-size:16px}
  .linkrow .chev{margin-left:auto;color:var(--muted)}
  /* All-time knop: blijft onder de etapperij, met een dikke gele rand */
  .linkrow.atbtn{border:3px solid var(--accent);font-weight:800;margin-top:14px}
  .linkrow.atbtn .ic{font-size:19px}
  .linkrow.atbtn .chev{color:var(--accent-ink)}
  /* Subklassement */
  .sp-empty{text-align:center;padding:26px 14px}
  .sp-empty .ic{font-size:30px}
  .sp-empty .t{font-size:16px;font-weight:700;margin:10px 0 4px}
  .sp-empty .s{color:var(--muted);font-size:13px;line-height:1.5;max-width:320px;margin:0 auto 16px}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#1a1a1a;
    border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .btn:active{opacity:.85}
  .btn.ghost{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .sp-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .sp-chip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .sp-chip.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .sp-chip.add{padding:6px 10px}
  .sp-edit{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:2px;margin-bottom:12px}
  .seg button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;
    padding:6px 14px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--txt)}
  .sp-count{color:var(--muted);font-size:12px;margin:0 0 10px}
  .sp-list{max-height:44vh;max-height:44dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .sp-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);
    cursor:pointer;font-size:14px}
  .sp-item:last-child{border-bottom:none}
  .sp-item .box{width:19px;height:19px;flex:0 0 auto;border-radius:5px;border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:transparent;background:transparent}
  .sp-item.sel .box{background:var(--accent);border-color:var(--accent);color:#1a1a1a}
  .sp-field{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:16px;margin-bottom:10px}
  .sp-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .sp-actions .btn{flex:1;justify-content:center;min-width:120px}
  .sp-del{background:none;border:none;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;padding:10px 6px}
  .sp-toast{background:rgba(54,211,153,.14);border:1px solid transparent;color:var(--green);
    border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  /* Klassementsverloop-grafiek (klik op een naam in de tussenstand) */
  .dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
  .dhead .nm{font-size:20px;font-weight:800}
  .dhead .pos{color:var(--muted);font-size:14px}
  .dhead .pos b{color:var(--txt)}
  .card.chartcard{padding:10px 10px 6px}
  .chartwrap{width:100%}
  .chartwrap svg{width:100%;height:auto;display:block}
  .chart-grid{stroke:var(--line);stroke-width:1}
  .chart-lbl{fill:var(--muted);font-size:12px;font-family:inherit}
  .chart-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .chart-dot{fill:var(--accent)}
  .chart-dot.last{stroke:var(--bg);stroke-width:2}
  .chart-val{fill:var(--txt);font-size:14px;font-weight:800;font-family:inherit}


  .at-intro{margin:12px 2px 2px;color:var(--muted);font-size:13px}
  .at-intro b{color:var(--txt)}
  .bigwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
    border-radius:12px;margin-top:12px;max-height:75vh}
  table.big{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:12.5px}
  table.big th,table.big td{padding:7px 9px;border-bottom:1px solid var(--line);
    white-space:nowrap;text-align:center}
  table.big thead th{position:sticky;top:0;z-index:2;background:var(--panel2);
    color:var(--txt);font-weight:700}
  table.big th.name,table.big td.name{position:sticky;left:0;z-index:1;background:var(--panel);
    text-align:left;font-weight:600;color:var(--txt);box-shadow:1px 0 0 var(--line)}
  table.big thead th.name{z-index:3}
  table.big td{color:var(--muted)}
  /* Uitslagen zijn NIET vet — alleen kolom- en rijtitels zijn vet. */
  table.big td.v{color:var(--txt)}
  /* meta-kolommen (Deeln./Gem./Beste) wat meer lucht */
  table.big th.meta,table.big td.meta{min-width:58px;padding-left:12px;padding-right:12px}
  table.big th.meta:first-of-type{border-left:1px solid var(--line)}
  table.big th:last-child,table.big td:last-child{padding-right:18px}
  table.big th.sortable{cursor:pointer;user-select:none}
  table.big th.sortable:hover{color:var(--accent)}
  table.big td.m1{background:rgba(247,212,23,.22);color:var(--txt)}
  table.big td.m2{background:rgba(150,157,171,.20);color:var(--txt)}
  table.big td.m3{background:rgba(190,120,55,.22);color:var(--txt)}
  table.big tr.sub td{background:var(--panel2);color:var(--muted);font-weight:600;font-size:11px;
    position:sticky;top:31px;z-index:2}
  table.big tr.sub td.name{z-index:3}
  table.big tbody tr:hover td{background:var(--panel2)}
  .statgrid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
  @media(min-width:680px){.statgrid{grid-template-columns:1fr 1fr}}
  .statcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .statcard h3{margin:0 0 2px;font-size:15px;color:var(--txt)}
  .statcard .csub{color:var(--muted);font-size:12px;margin:0 0 8px}
  table.mini{width:100%;border-collapse:collapse;font-size:13px}
  table.mini th,table.mini td{padding:5px 8px;border-bottom:1px solid var(--line);
    text-align:left;vertical-align:baseline}
  table.mini th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
  /* getalkolom smal + links, naamkolom vet — zo lijnt alles netjes uit */
  table.mini td.val{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;
    width:1%;padding-right:16px}
  table.mini td.nm{color:var(--txt);font-weight:700}
  table.mini tr:last-child td{border-bottom:none}
  .hl{background:rgba(247,212,23,.28);border-radius:4px;padding:0 3px}
</style>
</head>

eindposities over minstens 8 jaar (in percentielen! 0% = 1e, 100% = laatste in eindstand)", "header": ["Afwijking", "Deelnemer", "Gem. plek"], "namecol": 1, "rows": [["±4,5%", "Joris Reijbroek", "93%"], ["±6,6%", "Henk Wanningen", "91%"], ["±7,2%", "Erwin Hoogveld", "46%"], ["±10,4%", "Sjoerd Bisselink", "18%"], ["±11,7%", "Anne Matser", "78%"], ["±11,8%", "Patrick Mansveld", "61%"], ["±12,0%", "Wim Willemsen", "69%"], ["±12,7%", "Maurice Hoveijn", "28%"], ["±12,9%", "Wilbert Ebbers", "56%"], ["±13,7%", "Tim Wessels", "66%"], ["±14,0%", "Ruud Fritsema", "30%"], ["±14,2%", "Nico Jan Koenders", "64%"]]}, {"title": "De Rode Lantaarn-dragers", "sub": "vaakst laatste", "header": ["Keer", "Deelnemer"], "namecol": 1, "rows": [[2, "Antoon Ritzer"], [2, "Joris Reijbroek"], [2, "Lucas Vos"], [1, "Albert Muis"], [1, "Annemieke Wanningen"], [1, "Bart Krechting (Vaalman)"], [1, "Christonne Jansen"], [1, "Demi van Swaaij"], [1, "Frank Schoenmakers"], [1, "Hugo Overgoor"], [1, "Jack Gieles"], [1, "Jeroen Muis"], [1, "John Haubrich"], [1, "Joline Esser"], [1, "Jos ter Horst"], [1, "Koen Matser"], [1, "Lotte Makkinje"], [1, "Rik Horbach"], [1, "Sam de Langen"]]}, {"title": "Groei van de poule", "header": ["Mijlpaal", "Waarde"], "namecol": null, "rows": [["Kleinste editie", "9 (2003)"], ["Grootste editie", "92 (2026)"], ["Totaal unieke deelnemers", 187], ["Eenmalige deelnemers", 41], ["Gem. deelnemers per editie", 56]]}]}}</script>
<script>
const AT = JSON.parse(document.getElementById('data').textContent);
// De 'deelnemers · jaren · edities'-regel staat hier al in de titel (2 regels
// onder het logo), dus de losse at-intro-regel boven de tabellen blijft weg.
const SHOW_AT_INTRO = false;
const state = { atTab:'scores', q:'', scSort:{col:null,dir:1}, rkSort:{col:null,dir:1} };
const AT_TABS = [
  {id:'scores', label:'Scores'},
  {id:'rankings', label:'Rankings'},
  {id:'stats', label:'Statistieken'},
];
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t==='light'?'light':'dark');
  const b=document.getElementById('themebtn'); if(b) b.textContent = t==='light'?'🌙':'☀️';
}
function toggleTheme(){
  const n = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  try{ localStorage.setItem('tp-theme', n); }catch(e){}
  applyTheme(n);
}
window.toggleTheme=toggleTheme;
function setTab(t){ state.atTab=t; render(); }
window.setTab=setTab;


/* ---- All-time (historie 2003–…) — gedeeld door beheer + openbaar ---- */
function atMatch(name,q){ return !q || norm(name).includes(q); }
function hlName(name,q){ return q ? `<span class="hl">${esc(name)}</span>` : esc(name); }
function atEmpty(){ return `<div class="empty">Geen resultaat voor "${esc(state.q)}".</div>`; }

// Sorteert rijen op een kolom; lege waarden (niet meegedaan) altijd onderaan.
function atSort(rows, valFn, dir){
  return rows.map((r,i)=>[r,i]).sort((A,B)=>{
    let a=valFn(A[0]), b=valFn(B[0]);
    const an=(a==null||a===''), bn=(b==null||b==='');
    if(an&&bn) return A[1]-B[1];
    if(an) return 1; if(bn) return -1;
    if(a<b) return -dir; if(a>b) return dir; return A[1]-B[1];
  }).map(x=>x[0]);
}
function setAtSort(tab, key){
  const st = tab==='scores'?state.scSort:state.rkSort;
  if(st.col===key){ st.dir=-st.dir; }
  else { st.col=key; st.dir = (tab==='scores' && key!=='name') ? -1 : 1; }
  // Scrollpositie (verticaal + horizontaal) vasthouden over de her-render heen.
  const wrap=document.querySelector('.bigwrap');
  const sx = wrap?wrap.scrollLeft:0, sy=window.scrollY;
  render();
  const w2=document.querySelector('.bigwrap'); if(w2) w2.scrollLeft=sx;
  window.scrollTo({top:sy});
}
window.setAtSort=setAtSort;
function atTh(tab, key, label, extra){
  const st = tab==='scores'?state.scSort:state.rkSort;
  const arrow = st.col===key ? (st.dir<0?' ▼':' ▲') : '';
  return `<th class="${extra||''} sortable" onclick="setAtSort('${tab}','${key}')">${esc(label)}${arrow}</th>`;
}

function viewAtScores(q){
  const S = AT.scores; if(!S) return '';
  let rows = S.rows.filter(r=>atMatch(r.n,q));
  if(!rows.length) return atEmpty();
  const st = state.scSort;
  if(st.col){
    const k=st.col;
    const valFn = k==='name' ? (r=>norm(r.n))
      : k==='d' ? (r=>r.d) : k==='g' ? (r=>r.g) : k==='b' ? (r=>r.b)
      : (r=>{ const v=r.s[+k.slice(1)]; return typeof v==='number'?v:null; });
    rows = atSort(rows, valFn, st.dir);
  }
  const head = `<tr>${atTh('scores','name','Deelnemer','name')}`
    + S.years.map((y,i)=>atTh('scores','y'+i,y)).join('')
    + atTh('scores','d','Deeln.','meta') + atTh('scores','g','Gem.','meta') + atTh('scores','b','Beste','meta') + `</tr>`;
  const body = rows.map(r=>{
    const cells = r.s.map(v=> v==null ? `<td>·</td>` : `<td class="v">${esc(v)}</td>`).join('');
    return `<tr><td class="name">${hlName(r.n,q)}</td>${cells}`
      + `<td class="v meta">${r.d==null?'':esc(r.d)}</td>`
      + `<td class="v meta">${r.g==null?'':esc(r.g)}</td>`
      + `<td class="v meta">${r.b==null?'':esc(r.b)}</td></tr>`;
  }).join('');
  return `<div class="bigwrap"><table class="big"><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
}

function viewAtRankings(q){
  const R = AT.rankings; if(!R) return '';
  let rows = R.rows.filter(r=>atMatch(r.n,q));
  if(!rows.length) return atEmpty();
  const st = state.rkSort;
  if(st.col){
    const k=st.col;
    const valFn = k==='name' ? (r=>norm(r.n))
      : k==='b' ? (r=>r.b)
      : (r=>{ const v=r.r[+k.slice(1)]; return typeof v==='number'?v:null; });
    rows = atSort(rows, valFn, st.dir);
  }
  const head = `<tr>${atTh('rankings','name','Deelnemer','name')}`
    + R.years.map((y,i)=>atTh('rankings','y'+i,y)).join('')
    + atTh('rankings','b','Beste','meta') + `</tr>`;
  let pre = '';
  if(!q && R.counts){
    pre = `<tr class="sub"><td class="name">Deelnemers</td>`
      + R.counts.map(c=>`<td>${c==null?'':c}</td>`).join('') + `<td class="meta"></td></tr>`;
  }
  const body = rows.map(r=>{
    const cells = r.r.map(v=>{
      if(v==null) return `<td>·</td>`;
      const cls = v===1?'m1':v===2?'m2':v===3?'m3':'v';
      return `<td class="${cls}">${esc(v)}</td>`;
    }).join('');
    return `<tr><td class="name">${hlName(r.n,q)}</td>${cells}<td class="v meta">${r.b==null?'':esc(r.b)}</td></tr>`;
  }).join('');
  return `<div class="bigwrap"><table class="big"><thead>${head}</thead><tbody>${pre}${body}</tbody></table></div>`;
}

function viewAtStats(q){
  const St = AT.stats; if(!St) return '';
  const cards = St.blocks.map(b=>{
    let rws = b.rows;
    if(q) rws = b.rows.filter(row=>row.some(c=>c!=null && norm(String(c)).includes(q)));
    if(q && !rws.length) return '';
    const nc = (b.namecol===undefined) ? null : b.namecol;
    const head = b.header
      ? `<tr>${b.header.map(h=>`<th>${esc(h)}</th>`).join('')}</tr>`
      : '';
    const body = rws.map(row=>{
      const tds = row.map((c,i)=>{
        if(c==null || c==='') return `<td></td>`;
        let disp = esc(c);
        if(q && typeof c==='string' && norm(c).includes(q)) disp = `<span class="hl">${disp}</span>`;
        let cls='';
        if(i===nc) cls='nm';                                   // deelnemersnaam → vet
        else if(typeof c==='number' || /^\d/.test(String(c))) cls='val';  // getalwaarde → gedempt
        return `<td class="${cls}">${disp}</td>`;
      }).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    const sub = b.sub ? `<div class="csub">${esc(b.sub)}</div>` : '';
    return `<div class="statcard"><h3>${esc(b.title)}</h3>${sub}<table class="mini">${head}${body}</table></div>`;
  }).filter(Boolean).join('');
  if(!cards) return atEmpty();
  return `<div class="statgrid">${cards}</div>`;
}

function viewAlltime(q){
  if(!AT) return `<div class="empty">Geen All-time data beschikbaar.</div>`;
  // Op de openbare All-time-pagina staat deze info al in de titel onder het
  // logo (twee regels) — daar wordt SHOW_AT_INTRO op false gezet.
  const showIntro = (typeof SHOW_AT_INTRO === 'undefined') || SHOW_AT_INTRO;
  let intro = '';
  if(showIntro){
    const sub = (AT.stats && AT.stats.subtitle) ? AT.stats.subtitle : 'Historie van alle poules';
    intro = `<div class="at-intro">🏆 <b>Tourpoule All-Time</b> — ${esc(sub)}</div>`;
  }
  let body;
  if(state.atTab==='rankings') body = viewAtRankings(q);
  else if(state.atTab==='stats') body = viewAtStats(q);
  else body = viewAtScores(q);
  return intro + body;
}


function render(){
  document.getElementById('tabs').innerHTML = AT_TABS.map(t=>
    `<button class="${t.id===state.atTab?'on':''}" onclick="setTab('${t.id}')">${esc(t.label)}</button>`).join('');
  const q = norm(state.q);
  document.getElementById('app').innerHTML = viewAlltime(q);
  // 'Deelnemers per jaar'-rij precies onder de sticky jaartallen-kop plakken.
  const bigt = document.querySelector('table.big');
  if(bigt){
    const hr = bigt.querySelector('thead tr');
    const subtds = bigt.querySelectorAll('tr.sub td');
    if(hr && subtds.length){
      const h = Math.round(hr.getBoundingClientRect().height);
      subtds.forEach(td=>{ td.style.top = h + 'px'; });
    }
  }
  window.scrollTo({top:0});
}
document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value; render(); });
(function(){ try{ const t=localStorage.getItem('tp-theme'); applyTheme(t==='light'?'light':'dark'); }catch(e){} render(); })();
</script>
</body>
</html>
