<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --line:#2a2f3a;
    --txt:#e8eaed; --muted:#9aa3b2;
    --accent:#ffd60a; --accent-ink:#ffd60a; --green:#36d399; --red:#f87272;
    --rank2:#cdd3dd; --rank3:#e0a878; --header-bg:rgba(15,17,21,.92); --radius:14px;
    --fam-open-bg:#2b313d;
  }
  html[data-theme="light"]{
    --bg:#f5f6f8; --panel:#ffffff; --panel2:#eceff3; --line:#dfe3e8;
    --txt:#1b1e25; --muted:#647080;
    --accent:#ffd60a; --accent-ink:#9a7400; --green:#1a7f4b; --red:#d23b3b;
    --rank2:#8a93a3; --rank3:#b5793b; --header-bg:rgba(245,246,248,.92);
    --fam-open-bg:#eceff3;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);overflow-x:hidden;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:10;background:var(--header-bg);backdrop-filter:blur(10px);
    padding:max(12px,env(safe-area-inset-top)) 0 0}
  /* Binnenkolom, zelfde breedte/marge als <main> — zo lijnt het tabbladenmenu
     op desktop links uit met het filterveld en de tabellen eronder. Het logo
     zelf staat BUITEN deze kolom (volle header-breedte), want dat heeft zijn
     eigen marge-logica hieronder. */
  .hwrap{max-width:780px;margin:0 auto;padding:0 16px}
  .titlerow{display:flex;align-items:center;gap:10px}
  /* Logo-rij: 16px minimum-marge — knop — vaste 16px-kloof — het logo zo
     groot als past (tot zijn natuurlijke maximum) — vaste 16px-kloof — knop
     — 16px minimum-marge. De buitenmarges (.side-spacer) groeien mee zodra
     er ruimte over is; het logo groeit niet voorbij zijn eigen maximum. */
  .brand{display:flex;align-items:center;min-height:48px}
  .brand .side-spacer{flex:1 1 0;min-width:16px}
  .brand .iconbtn{flex:0 0 34px;margin:0 0 0 16px;position:static}
  .brand .backbtn{flex:0 0 34px;margin:0 16px 0 0;position:static;text-decoration:none}
  h1{font-size:19px;margin:0;letter-spacing:.3px} h1 .dot{color:var(--accent-ink)}
  .iconbtn{margin-left:auto;flex:0 0 auto;width:34px;height:34px;padding:0;border-radius:999px;
    background:var(--panel2);border:1px solid var(--line);color:var(--muted);cursor:pointer;
    font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn:active{background:var(--line)}
  .theme-ico{display:none}
  html[data-theme="light"] .theme-moon{display:block}
  html[data-theme="dark"] .theme-sun{display:block}
  .sub{color:var(--txt);text-align:center;font-size:16px;margin-top:4px;font-weight:bold}
  .sub .at-count{display:block;font-weight:400;font-size:14px;margin-top:2px}
  .search{margin-bottom:12px;position:relative}
  .search input{width:100%;padding:12px 14px 12px 40px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:16px}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
  /* Horizontale lijn zowel boven als onder de tabbladen (symmetrisch). In de
     detailweergave worden de tabs geleegd; dan verbergen we de hele balk zodat
     er geen twee lege lijnen overblijven. */
  .tabs{display:flex;gap:14px;margin-top:10px;padding-top:10px;padding-bottom:10px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    box-shadow:0 6px 8px -6px rgba(0,0,0,.22);
    overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tabs:empty{display:none}
  .tabs button{flex:0 0 auto;background:none;border:none;color:var(--muted);padding:8px 2px;
    font-size:15px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent;
    transition:transform 140ms cubic-bezier(.23,1,.32,1)}
  .tabs button:active{transform:scale(.96)}
  .tabs button.on{color:var(--txt);border-bottom-color:var(--accent)}
  main{padding:12px 16px calc(60px + env(safe-area-inset-bottom));max-width:780px;margin:0 auto}
  .muted{color:var(--muted)} .empty{color:var(--muted);text-align:center;padding:40px 10px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  td.wrap{white-space:normal;width:99%} .tm{color:var(--muted);font-size:12px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  tbody tr[role="button"]{cursor:pointer;transition:transform 140ms cubic-bezier(.23,1,.32,1)}
  tbody tr[role="button"]:active{transform:scale(.985)}
  tbody tr[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .rank{color:var(--muted);width:40px;min-width:40px;text-align:center;padding-left:2px;padding-right:2px}
  .rank.top1{color:var(--accent-ink)} .rank.top2{color:var(--rank2)} .rank.top3{color:var(--rank3)}
  .jersey{display:inline-flex;vertical-align:middle;line-height:0}
  .jersey svg{display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.18))}
  .mvcol{width:30px;min-width:30px;text-align:left;padding-left:2px;padding-right:2px}
  .mv{display:inline-block;font-size:10px;font-weight:700}
  .mv.up{color:var(--green)} .mv.down{color:var(--red)} .mv.flat{color:var(--muted)}
  .dop{font-size:12px;color:var(--muted);margin-top:2px}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .pill.out{background:rgba(248,114,114,.15);color:var(--red);border-color:transparent}
  .abrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}
  .abrow:last-child{border-bottom:none}
  .abrow .enr{font-size:11px;font-weight:700;color:var(--muted);min-width:24px}
  .abrow .abnm{flex:1} .abrow .tm{flex:0 0 auto;text-align:right}
  /* Logo krimpt vloeiend mee als het niet past (min-width:0 laat de kaart
     onder haar 'natuurlijke' breedte krimpen; het logo zelf volgt via
     max-width/max-height — geen harde media-query-sprong meer nodig). */
  .logoplate{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 16px;
    display:inline-flex;align-items:center;justify-content:center;flex:0 1 auto;min-width:0}
  .logo{display:block;width:auto;height:auto;max-width:100%;max-height:85px}
  .meta-foot{color:var(--muted);font-size:12px;text-align:center;margin-top:24px}
  .linkrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:14px;margin-bottom:8px;color:var(--txt);text-decoration:none;font-size:16px}
  .linkrow .chev{margin-left:auto;color:var(--muted)}
  /* All-time knop: blijft onder de etapperij, met een dikke gele rand */
  .linkrow.atbtn{border:3px solid var(--accent);font-weight:800;margin-top:14px}
  .linkrow.atbtn .ic{font-size:19px}
  .linkrow.atbtn .chev{color:var(--accent-ink)}
  /* Jaar-index: etappes als compact tegelraster (i.p.v. een lange rijenlijst).
     auto-fill houdt de tegels ~vierkant en klein op elk scherm: ~4 per rij op
     mobiel, meer op een breed scherm. De nieuwste etappe krijgt een gele rand. */
  .stagegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
    gap:8px;margin-bottom:8px}
  .stile{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:5px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;text-decoration:none;color:var(--txt);
    transition:transform 140ms cubic-bezier(.23,1,.32,1)}
  .stile:active{transform:scale(.95)}
  .stnum{font-size:18px;font-weight:700;line-height:1}
  .stico{display:flex;color:var(--muted);line-height:0}
  .stile.now{border:2px solid var(--accent);background:rgba(255,214,10,.14)}
  .stile.now .stnum,.stile.now .stico{color:var(--accent-ink)}
  /* Subklassement */
  .sp-empty{text-align:center;padding:26px 14px}
  .sp-empty .ic{font-size:30px}
  .sp-empty .t{font-size:16px;font-weight:700;margin:10px 0 4px}
  .sp-empty .s{color:var(--muted);font-size:13px;line-height:1.5;max-width:320px;margin:0 auto 16px}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--accent);color:#1a1a1a;
    border:none;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:700;cursor:pointer}
  .btn:active{opacity:.85}
  .btn.ghost{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
  .sp-chips{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .sp-chip{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:999px;
    padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .sp-chip.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
  .sp-chip.add{padding:6px 10px}
  .sp-edit{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;
    padding:2px;margin-bottom:12px}
  .seg button{background:none;border:none;color:var(--muted);font-size:13px;font-weight:600;
    padding:6px 14px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--panel);color:var(--txt)}
  .sp-count{color:var(--muted);font-size:12px;margin:0 0 10px}
  .sp-list{max-height:44vh;max-height:44dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .sp-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);
    cursor:pointer;font-size:14px}
  .sp-item:last-child{border-bottom:none}
  .sp-item .box{width:19px;height:19px;flex:0 0 auto;border-radius:5px;border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:transparent;background:transparent}
  .sp-item.sel .box{background:var(--accent);border-color:var(--accent);color:#1a1a1a}
  .sp-field{width:100%;padding:11px 13px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);font-size:16px;margin-bottom:10px}
  .sp-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .sp-actions .btn{flex:1;justify-content:center;min-width:120px}
  .sp-del{background:none;border:none;color:var(--red);font-size:13px;font-weight:600;cursor:pointer;padding:10px 6px}
  .sp-toast{background:rgba(54,211,153,.14);border:1px solid transparent;color:var(--green);
    border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
  /* Familiestrijd */
  /* Uitgeklapte familie: kop-rij en ledenblok vormen visueel één geheel —
     zelfde achtergrond, een accent-balk die er links langs loopt, en een
     dikke lijn eronder die het blok afsluit. */
  tr.famrow.open>td{background:var(--fam-open-bg);border-bottom:none}
  tr.famrow.open>td:first-child{border-left:3px solid var(--accent)}
  .fam-detailrow>td{padding:0;border-bottom:2px solid var(--line)}
  .fam-detail{background:var(--fam-open-bg);border-left:3px solid var(--accent)}
  .fam-sub{width:100%;border-collapse:collapse}
  .fam-sub td{border-bottom:1px solid var(--line);padding:7px 6px;white-space:nowrap}
  .fam-sub tr:last-child td{border-bottom:none}
  .fam-sub td.wrap{white-space:normal;width:99%}
  .fam-sub td.fam-r{padding-left:50px;color:var(--muted);font-variant-numeric:tabular-nums}
  .fam-sub td.fam-s{text-align:right;padding-right:22px;font-variant-numeric:tabular-nums}
  /* Klassementsverloop-grafiek (klik op een naam in de tussenstand) */
  .dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
  .dhead .nm{font-size:20px;font-weight:800}
  .dhead .pos{color:var(--muted);font-size:14px}
  .dhead .pos b{color:var(--txt)}
  .card.chartcard{padding:10px 10px 6px}
  .chartwrap{width:100%}
  .chartwrap svg{width:100%;height:auto;display:block}
  .chart-grid{stroke:var(--line);stroke-width:1}
  .chart-lbl{fill:var(--muted);font-size:12px;font-family:inherit}
  .chart-line{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
  .chart-dot{fill:var(--accent)}
  .chart-dot.last{stroke:var(--bg);stroke-width:2}
  .chart-val{fill:var(--txt);font-size:14px;font-weight:800;font-family:inherit}
  /* De grafiekweergave komt zachtjes binnen i.p.v. hard te 'teleporteren'. */
  .detail{--enter-scale:.98;
    transition:opacity 220ms cubic-bezier(.23,1,.32,1), transform 220ms cubic-bezier(.23,1,.32,1)}
  @starting-style{ .detail{opacity:0; transform:scale(var(--enter-scale))} }
  @media (prefers-reduced-motion: reduce){
    .tabs button:active, tbody tr[role="button"]:active, .stile:active{transform:none}
    .detail{--enter-scale:1}
  }


  /* De tabel scrollt binnen zijn eigen vak (hoogte gezet via JS); daardoor
     blijft de TABEL-kop (kolomtitels + winnaarsrij) plakken terwijl je door de
     deelnemers scrollt — én blijft horizontaal scrollen op smalle schermen
     mogelijk. (position:sticky werkt alleen t.o.v. deze scroll-container.) */
  .es-wrap{overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  /* border-collapse:collapse + position:sticky op cellen geeft in Chrome
     rendering-glitches (niet-sticky cellen "lekken" zichtbaar door de sticky
     rang/naam-kolom heen bij horizontaal scrollen) — daarom separate. */
  table.es{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
  table.es th,table.es td{padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
  table.es td.num,table.es th.num{text-align:right;font-variant-numeric:tabular-nums}
  table.es thead th{position:sticky;top:0;z-index:3;background:var(--header-bg);
    backdrop-filter:blur(10px);color:var(--muted);font-weight:600;font-size:12px;
    text-transform:uppercase;letter-spacing:.3px}
  table.es thead tr.winrow th{z-index:2;font-weight:400;color:var(--txt);font-size:11px;
    text-transform:none;letter-spacing:0;border-bottom:2px solid var(--line)}
  table.es thead tr.winrow th .wp{color:var(--accent-ink);font-weight:800}
  td.es-final{font-weight:800;color:var(--accent-ink)}
  .es-pick{color:var(--muted)} .es-pick.ok{color:var(--green);font-weight:700}
  /* "table.es" moet in de selector zelf zitten, anders verliest hij het van de
     algemene th/td-paddingregel hierboven (zelfde aantal classes, minder types
     telt lager — anders wint de generieke 8px altijd). */
  table.es th.divl,table.es td.divl{border-left:2px solid var(--line);padding-left:30px}
  table.es th.totcol,table.es td.totcol{padding-right:30px}
  /* Rangnummer- en naamkolom blijven vastgezet tijdens horizontaal scrollen. */
  table.es td.rank,table.es th.rank{position:sticky;left:0;z-index:1;
    background:var(--panel);width:46px;min-width:46px;text-align:center;padding-left:4px;padding-right:4px}
  table.es td.namecol,table.es th.namecol{position:sticky;left:46px;z-index:1;
    background:var(--panel);border-right:2px solid var(--line);padding-right:30px}
  table.es td.tourcol,table.es th.tourcol{padding-left:30px}
  table.es thead th.rank,table.es thead th.namecol{z-index:4;background:var(--header-bg)}
  /* De winnaarsrij (2e kop-rij) heeft door de extra 'tr.winrow'-type in de
     selector een HOGERE specificiteit dan de regel hierboven, dus zonder deze
     override zakken de vastgezette rang/naam-cellen van die rij terug naar
     winrow's eigen z-index en schuift de rest van die rij er zichtbaar doorheen. */
  table.es thead tr.winrow th.rank,table.es thead tr.winrow th.namecol{z-index:5;background:var(--header-bg)}
  .bonusbtn{background:none;border:none;color:inherit;font:inherit;cursor:pointer;
    text-decoration:underline;text-underline-offset:3px;padding:0}
  .es-detailrow{display:none}
  /* Specifiek genoeg nodig om de mobiele th/td-paddingregel hieronder te
     verslaan (zelfde specificiteit zou anders de generieke 7px/6px winnen). */
  table.es tr.es-detailrow>td{background:var(--panel2);white-space:normal;padding:14px 16px 14px 24px}
  .es-dl{display:flex;flex-direction:column;gap:10px}
  .es-dl .r{display:flex;align-items:baseline;gap:4px 8px;font-size:13px;flex-wrap:wrap}
  .es-dl .r .lab{flex:0 0 170px;min-width:0;white-space:normal;color:var(--muted)}
  .es-dl .r .lab .pts{font-size:11px;opacity:.75}
  .es-dl .r .pk{flex:1 1 120px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .es-dl .r .pk.ok{color:var(--green);font-weight:700}
  @media (max-width:640px){
    table.es .predcol,table.es .tourcol{display:none}
    table.es th,table.es td{padding:7px 6px;font-size:13px}
    table.es th.bonuscol{min-width:60px}
    table.es thead tr.winrow{display:none}
    /* Geen verticale scheidslijnen op mobiel. */
    table.es th.divl,table.es td.divl{border-left:none}
    table.es th.namecol,table.es td.namecol{border-right:none}
    .es-card{padding:8px}
    tr.es-detailrow.open{display:table-row}
  }
  @media (min-width:641px){
    .bonusbtn{text-decoration:none;cursor:default;pointer-events:none}
  }
  /* Doorlopers naar Wrapped en Onthulling, onder de tabel. */
  .es-links{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px;
    margin:26px auto 0}
  .es-lnk{display:block;text-decoration:none;font-weight:800;padding:14px;
    border-radius:12px;text-align:center;font-size:15px}
  .es-lnk.a{background:var(--accent);color:#141414}
  .es-lnk.b{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}
</style>

 <div class="brand">

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const state = { tab:'eindstand', q:'' };
const TABS = [
  {id:'eindstand', label:'Eindstand'},
  {id:'fam', label:'Fam'},
  {id:'subklassement', label:'Subs'},
].filter(t => t.id!=='fam' || (D.families && D.families.length));
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t==='light'?'light':'dark'); }
function toggleTheme(){ const n=document.documentElement.getAttribute('data-theme')==='light'?'dark':'light'; try{localStorage.setItem('tp-theme',n);}catch(e){} applyTheme(n); }
window.toggleTheme=toggleTheme;
function rankClass(r){ return r===1?'top1':r===2?'top2':r===3?'top3':''; }
function jerseySvg(rank){
  const c={1:{body:'#f6d417',num:'#4a3b00',dots:false},2:{body:'#1fa64a',num:'#ffffff',dots:false},3:{body:'#ffffff',num:'#333333',dots:true}}[rank];
  const dots=c.dots?`<g fill="#e0241f"><circle cx="16" cy="10.5" r="1.4"/><circle cx="24" cy="10.5" r="1.4"/><circle cx="6" cy="12" r="1.3"/><circle cx="34" cy="12" r="1.3"/><circle cx="12.5" cy="18.5" r="1.4"/><circle cx="27.5" cy="18.5" r="1.4"/><circle cx="15" cy="26.5" r="1.4"/><circle cx="20" cy="28.5" r="1.3"/><circle cx="25" cy="26.5" r="1.4"/></g>`:'';
  return `<span class="jersey"><svg viewBox="0 0 40 34" width="30" height="26" aria-hidden="true"><path d="M13 3 L16 3 C18 7 22 7 24 3 L27 3 L38 9 L33 17 L29 14.5 L29 31 L11 31 L11 14.5 L7 17 L2 9 Z" fill="${c.body}" stroke="rgba(0,0,0,.22)" stroke-width="1" stroke-linejoin="round"/>${dots}<text x="20" y="23" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" fill="${c.num}">${rank}</text></svg></span>`;
}
function rankBadge(rank){ return (rank>=1&&rank<=3)?jerseySvg(rank):String(rank); }

// ---------- Eindstand-tabel ----------
const esOpen = new Set();
// Open/dicht klappen bouwt de hele tabel opnieuw op, en dan begint het
// scrollvak weer bovenaan. Daarom onthouden we waar de aangeklikte rij op het
// scherm stond en schuiven we daar na de herbouw naartoe terug — zo blijft de
// rij onder je vinger staan.
function esToggle(id){
  const wrap = document.querySelector('.es-wrap');
  const rij = wrap && wrap.querySelector(`tr[data-rid="${id}"]`);
  const topVoor = rij ? rij.getBoundingClientRect().top : null;
  const scrollVoor = wrap ? wrap.scrollTop : 0;
  const paginaVoor = window.scrollY;

  if(esOpen.has(id)) esOpen.delete(id); else esOpen.add(id);
  render();

  const wrap2 = document.querySelector('.es-wrap');
  if(!wrap2) return;
  wrap2.scrollTop = scrollVoor;
  window.scrollTo(0, paginaVoor);
  if(topVoor === null) return;
  const rij2 = wrap2.querySelector(`tr[data-rid="${id}"]`);
  if(rij2) wrap2.scrollTop += rij2.getBoundingClientRect().top - topVoor;
}
window.esToggle=esToggle;
function tEindstand(q){
  const cats=D.categories;
  const rows=D.rows.filter(r=>!q||norm(r.name).includes(q));
  if(!rows.length) return `<div class="empty">Geen deelnemer gevonden.</div>`;
  const h1=`<tr><th class="num rank">#</th><th class="namecol">Deelnemer</th><th class="num tourcol">Tour</th>`
    +`<th class="num bonuscol">Bonus</th><th class="num totcol">Totaal</th>`
    +cats.map((c,i)=>`<th class="predcol${i===0?' divl':''}">${c.emoji} ${esc(c.label)}</th>`).join('')
    +`<th class="predcol">Eigen voorspelling</th></tr>`;
  const h2=`<tr class="winrow"><th class="rank"></th><th class="namecol">Juiste uitslag</th><th class="tourcol"></th><th class="bonuscol"></th><th class="totcol"></th>`
    +cats.map((c,i)=>`<th class="predcol${i===0?' divl':''}">${esc(c.winner)} <span class="wp">(${c.points})</span></th>`).join('')
    +`<th class="predcol"></th></tr>`;
  const body=rows.map(r=>{
    const preds=cats.map((c,i)=>{ const p=r.preds[c.key]||{};
      return `<td class="predcol${i===0?' divl':''}"><span class="es-pick ${p.correct?'ok':''}">${esc(p.pick||'—')}</span></td>`; }).join('');
    let tr=`<tr data-rid="${r.id}"><td class="num rank ${rankClass(r.rank)}">${rankBadge(r.rank)}</td>`
      +`<td class="namecol"><b>${esc(r.name)}</b></td><td class="num tourcol">${r.tour}</td>`
      +`<td class="num bonuscol"><button class="bonusbtn" onclick="esToggle(${r.id})" aria-label="Toon voorspellingen van ${esc(r.name)}">+${r.bonus}</button></td>`
      +`<td class="num es-final totcol">${r.final}</td>`
      +preds
      +`<td class="predcol"><span class="es-pick ${r.ownOk?'ok':''}">${esc(r.own||'—')}</span></td></tr>`;
    if(esOpen.has(r.id)){
      const dl=cats.map(c=>{ const p=r.preds[c.key]||{};
        return `<div class="r"><span class="lab">${c.emoji} ${esc(c.label)} <span class="pts">(${c.points})</span></span>`
          +`<span class="pk ${p.correct?'ok':''}">${esc(p.pick||'—')}</span></div>`; }).join('');
      const own=`<div class="r"><span class="lab">📝 Eigen voorspelling</span><span class="pk ${r.ownOk?'ok':''}">${esc(r.own||'—')}</span></div>`;
      tr+=`<tr class="es-detailrow open"><td colspan="5"><div class="es-dl">${dl}${own}</div></td></tr>`;
    }
    return tr;
  }).join('');
  return `<div class="card es-card"><div class="es-wrap"><table class="es"><thead>${h1}${h2}</thead><tbody>${body}</tbody></table></div></div>`;
}
// De tabel scrollt in een eigen vak: zet de hoogte tot onderaan het scherm,
// en laat de 2e kopregel (winnaars) precies onder de 1e plakken.
function esStick(){
  const wrap=document.querySelector('.es-wrap'); if(!wrap) return;
  const top=wrap.getBoundingClientRect().top;
  wrap.style.maxHeight = Math.max(260, window.innerHeight - top - 14) + 'px';
  const t=wrap.querySelector('thead tr:first-child th');
  if(t){ const h=t.getBoundingClientRect().height;
    wrap.querySelectorAll('thead tr.winrow th').forEach(el=>{ el.style.top=h+'px'; }); }
}

// ---------- Familiestrijd ----------
const famOpen = new Set();
function famToggle(k){ if(famOpen.has(k)) famOpen.delete(k); else famOpen.add(k); render(); }
window.famToggle=famToggle;
function tFam(){
  const fams=(D.families||[]);
  if(!fams.length) return `<div class="empty">Nog geen familiestand.</div>`;
  return `<div class="card"><div class="tw"><table><thead><tr><th class="rank">#</th><th>Familie</th><th class="num">Gemiddeld</th></tr></thead><tbody>${
    fams.map(f=>{
      const open=famOpen.has(f.key);
      const head=`<tr class="famrow${open?' open':''}" tabindex="0" role="button" aria-expanded="${open}" aria-label="Toon leden van familie ${esc(f.name)}" onclick="famToggle('${f.key}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();famToggle('${f.key}');}"><td class="rank ${rankClass(f.rank)}">${rankBadge(f.rank)}</td><td class="wrap"><b>${esc(f.name)}</b><div class="tm">${f.n} leden</div></td><td class="num"><b>${f.avg}</b></td></tr>`;
      if(!open) return head;
      const mem=f.members.map(m=>`<tr class="fam-mem"><td class="fam-r">(${m.rank})</td><td class="wrap">${esc(m.name)}</td><td class="fam-s">${m.score}</td></tr>`).join('');
      return head+`<tr class="fam-detailrow"><td class="fam-detail" colspan="3"><table class="fam-sub"><tbody>${mem}</tbody></table></td></tr>`;
    }).join('')
  }</tbody></table></div></div>`;
}

// ---------- Subklassement (eigen groepjes, op eindscore) ----------
// Zelfde localStorage-sleutel als de openbare tussenstandpagina's, zodat een
// subklassement dat iemand daar al maakte hier direct ook verschijnt.
const SP_KEY='tp-subpoule:1:'+(D.year||'x');
const SP_KEY_LEGACY='tp-subpoule-es:1:'+(D.year||'x'); // vóór het delen met de tussenstandpagina's
let spViews=[], spActive=null, spEdit=null, spToast='';
function spLoad(){
  try{ const raw=localStorage.getItem(SP_KEY); if(raw){ const o=JSON.parse(raw); spViews=o.views||[]; spActive=o.active||null; } }catch(e){ spViews=[]; }
  // Eenmalige migratie: had je al een subklassement op de (oude) losse eindstand-sleutel
  // staan en nog niets onder de gedeelde sleutel, neem die dan over zodat je opgeslagen
  // groep niet ineens "verdwenen" lijkt.
  if(!spViews.length){
    try{ const legacy=localStorage.getItem(SP_KEY_LEGACY); if(legacy){ const o=JSON.parse(legacy); if(o.views&&o.views.length){ spViews=o.views; spActive=o.active||null; spSave(); } } }catch(e){}
  }
  if(spActive&&!spViews.some(v=>v.id===spActive)) spActive=null; if(!spActive&&spViews.length) spActive=spViews[0].id;
}
function spSave(){ try{ localStorage.setItem(SP_KEY, JSON.stringify({views:spViews, active:spActive})); }catch(e){} }
function spId(){ return 'v'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function spRoster(){ return D.standings.map(r=>({id:r.id,name:r.name})).sort((a,b)=>a.name.localeCompare(b.name,'nl')); }
function rankBy(arr,key){ const s=[...arr].sort((a,b)=>b[key]-a[key]); const o={}; let pv=null,pr=0; s.forEach((x,i)=>{ const r=(pv!==null&&x[key]===pv)?pr:i+1; o[x.id]=r; pv=x[key]; pr=r; }); return o; }
function subStandings(mset){ const rows=D.standings.filter(r=>mset.has(r.id)).map(r=>({id:r.id,name:r.name,total:r.total})); const cur=rankBy(rows,'total'); return rows.map(r=>({...r,rank:cur[r.id]})).sort((a,b)=>a.rank-b.rank||a.name.localeCompare(b.name,'nl')); }
function subKlasTable(mset){ const rows=subStandings(mset); return `<table><thead><tr><th class="rank">#</th><th>Deelnemer</th><th class="num">Totaal</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="rank ${rankClass(r.rank)}">${rankBadge(r.rank)}</td><td class="wrap"><b>${esc(r.name)}</b></td><td class="num"><b>${r.total}</b></td></tr>`).join('')}</tbody></table>`; }
function spEditorHtml(){ const sel=spEdit.members; const items=spRoster().map(p=>`<div class="sp-item ${sel.has(p.id)?'sel':''}" data-id="${p.id}" data-n="${esc(norm(p.name))}" onclick="spToggle(this)"><span class="box">&#10003;</span><span>${esc(p.name)}</span></div>`).join(''); return `<div class="card"><input class="sp-field" id="spName" type="text" placeholder="Naam van je subklassement" value="${esc(spEdit.name)}" maxlength="40"><div class="search" style="margin-top:0;margin-bottom:10px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><input class="sp-field" id="spSearch" type="search" placeholder="Zoek deelnemer…" style="margin-bottom:0;padding-left:40px" oninput="spFilter(this.value)"></div><div class="sp-count" id="spCount">${sel.size} gekozen</div><div class="sp-list" id="spList">${items}</div><div class="sp-actions"><button class="btn" onclick="spSaveEdit()">Opslaan</button><button class="btn ghost" onclick="spCancel()">Annuleren</button>${spEdit.id?'<button class="sp-del" onclick="spDeleteEdit()">Verwijderen</button>':''}</div></div>`; }
function tSubklassement(){ let html=''; if(spToast){ html+=`<div class="sp-toast">${esc(spToast)}</div>`; spToast=''; } if(spEdit) return html+spEditorHtml(); if(!spViews.length){ return html+`<div class="card"><div class="sp-empty"><div class="ic">👥</div><div class="t">Maak je eigen subklassement</div><div class="s">Kies bijvoorbeeld je familie of vrienden en zie hun onderlinge eindstand. Je keuze wordt op dit apparaat bewaard.</div><button class="btn" onclick="spNew()">➕ Maak een subklassement</button></div></div>`; } const v=spViews.find(x=>x.id===spActive)||spViews[0]; spActive=v.id; const chips=spViews.map(x=>`<button class="sp-chip ${x.id===v.id?'on':''}" onclick="spSelect('${x.id}')">${esc(x.name)}</button>`).join('')+`<button class="sp-chip add" onclick="spNew()" aria-label="Nieuw subklassement">➕</button><button class="sp-edit" onclick="spEditView('${v.id}')" aria-label="Bewerk subklassement">✏️</button>`; const mset=new Set(v.members); const body=v.members.length?subKlasTable(mset):`<div class="empty">Nog geen deelnemers gekozen. Tik op ✏️ om je groep samen te stellen.</div>`; const share=v.members.length?`<div style="margin-top:12px"><button class="btn ghost" onclick="spShare('${v.id}')">🔗 Deel dit subklassement</button></div>`:''; return html+`<div class="sp-chips">${chips}</div><div class="card"><div class="tw">${body}</div></div>${share}`; }
function spSelect(id){ spActive=id; spSave(); render(); }
function spNew(){ spEdit={id:null,name:'',members:new Set()}; render(); }
function spEditView(id){ const v=spViews.find(x=>x.id===id); if(!v)return; spEdit={id:v.id,name:v.name,members:new Set(v.members)}; render(); }
function spToggle(el){ const id=parseInt(el.getAttribute('data-id'),10); if(spEdit.members.has(id)){ spEdit.members.delete(id); el.classList.remove('sel'); } else { spEdit.members.add(id); el.classList.add('sel'); } const c=document.getElementById('spCount'); if(c) c.textContent=spEdit.members.size+' gekozen'; }
function spFilter(q){ const nq=norm(q); document.querySelectorAll('#spList .sp-item').forEach(el=>{ el.style.display=(!nq||el.getAttribute('data-n').includes(nq))?'':'none'; }); }
function spSaveEdit(){ const nameEl=document.getElementById('spName'); const name=(nameEl.value||'').trim(); if(!name){ nameEl.focus(); return; } if(spEdit.id){ const v=spViews.find(x=>x.id===spEdit.id); if(v){ v.name=name; v.members=[...spEdit.members]; } } else { const id=spId(); spViews.push({id,name,members:[...spEdit.members]}); spActive=id; } spEdit=null; spSave(); render(); }
function spCancel(){ spEdit=null; render(); }
function spDeleteEdit(){ if(spEdit&&spEdit.id){ spViews=spViews.filter(x=>x.id!==spEdit.id); if(spActive===spEdit.id) spActive=spViews.length?spViews[0].id:null; } spEdit=null; spSave(); render(); }
function spEncode(v){ return btoa(unescape(encodeURIComponent(JSON.stringify({n:v.name,m:v.members})))); }
function spDecode(s){ try{ return JSON.parse(decodeURIComponent(escape(atob(s)))); }catch(e){ return null; } }
function spShare(id){ const v=spViews.find(x=>x.id===id); if(!v)return; const url=location.origin+location.pathname+'#sp='+spEncode(v); if(navigator.share){ navigator.share({title:'Subklassement '+v.name, url}).catch(()=>{}); return; } navigator.clipboard&&navigator.clipboard.writeText(url); spToast='Deel-link gekopieerd.'; render(); }
function spImportFromHash(){ const m=(location.hash||'').match(/sp=([^&]+)/); if(!m) return; const o=spDecode(m[1]); if(!o||!o.n) return; const same=spViews.find(v=>v.name===o.n&&JSON.stringify(v.members)===JSON.stringify(o.m)); history.replaceState(null,'',location.pathname); if(same){ spActive=same.id; spSave(); state.tab='subklassement'; return; } const id=spId(); spViews.push({id,name:o.n,members:o.m||[]}); spActive=id; spSave(); spToast='Subklassement “'+o.n+'” toegevoegd.'; state.tab='subklassement'; }

function setTab(t){ state.tab=t; if(t!=='subklassement') spEdit=null; render(); }
window.setTab=setTab;
document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value; render(); });

function render(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>`<button class="${t.id===state.tab?'on':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('');
  const hideSearch = state.tab!=='eindstand';
  const sb=document.getElementById('searchbar'); if(sb) sb.style.display=hideSearch?'none':'';
  const q=norm(state.q);
  let html = state.tab==='fam'?tFam() : state.tab==='subklassement'?tSubklassement() : tEindstand(q);
  // Doorlopers naar de twee zusterpagina's, net als onderaan De Onthulling.
  const zuslinks = `<div class="es-links">`
    + `<a class="es-lnk a" href="../wrapped/">🎁 Naar jouw persoonlijke Wrapped</a>`
    + `<a class="es-lnk b" href="../onthulling/">🎬 De Onthulling nog eens zien</a></div>`;
  document.getElementById('app').innerHTML = html + zuslinks + `<div class="meta-foot">Bijgewerkt: ${esc(D.generated_at||'')}</div>`;
  if(state.tab==='eindstand'){ esStick(); requestAnimationFrame(esStick); }
}
applyTheme(document.documentElement.getAttribute('data-theme') || 'light');
window.addEventListener('resize', ()=>{ if(state.tab==='eindstand') esStick(); });
spLoad();
spImportFromHash();
render();
</script>
</body>
</html>
