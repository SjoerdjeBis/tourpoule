const state = { tab:'tussenstand', q:'' };
const TABS = [
  {id:'tussenstand', label:'Tussenstand'},
  {id:'dagscore', label:'Dagscore'},
  {id:'uitslag', label:'Uitslag'},
];
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t==='light'?'light':'dark');
  const b=document.getElementById('themebtn'); if(b) b.textContent = t==='light'?'🌙':'☀️';
}
function toggleTheme(){
  const n = document.documentElement.getAttribute('data-theme')==='light'?'dark':'light';
  try{ localStorage.setItem('tp-theme', n); }catch(e){}
  applyTheme(n);
}
window.toggleTheme=toggleTheme;
function rankClass(r){ return r===1?'top1':r===2?'top2':r===3?'top3':''; }
function setTab(t){ state.tab=t; render(); } window.setTab=setTab;
document.getElementById('q').addEventListener('input', e=>{ state.q=e.target.value; render(); });

function tTussenstand(q){
  const rows = D.standings.filter(r=>!q||norm(r.name).includes(q));
  if(!rows.length) return `<div class="empty">Geen deelnemer gevonden.</div>`;
  return `<div class="card"><div class="tw"><table><thead><tr><th class="num">#</th><th>Deelnemer</th><th class="num">Dag</th><th class="num">Totaal</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.name)}</td><td class="num">${r.dag}</td><td class="num"><b>${r.total}</b></td></tr>`).join('')
  }</tbody></table></div></div>`;
}
function tDagscore(q){
  const rows = D.dagscore.filter(r=>!q||norm(r.name).includes(q));
  if(!D.dagscore.length) return `<div class="empty">Geen dagscores voor deze etappe.</div>`;
  if(!rows.length) return `<div class="empty">Geen deelnemer gevonden.</div>`;
  return `<div class="card"><div class="tw"><table><thead><tr><th class="num">#</th><th>Deelnemer</th><th class="num">Punten</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.name)}</td><td class="num">${r.score}</td></tr>`).join('')
  }</tbody></table></div></div>`;
}
function tUitslag(q){
  const rows = D.results.filter(r=>!q||norm(r.rider).includes(q)||norm(r.team).includes(q));
  if(!rows.length) return `<div class="empty">Geen renner gevonden.</div>`;
  return `<div class="card"><div class="tw"><table><thead><tr><th class="num">#</th><th>Renner</th><th class="num">Punten</th></tr></thead><tbody>${
    rows.map(r=>`<tr><td class="num rank ${rankClass(r.rank)}">${r.rank}</td><td class="wrap">${esc(r.rider)}<div class="tm">${esc(r.team)}</div></td><td class="num">${r.points}</td></tr>`).join('')
  }</tbody></table></div></div>`;
}
function render(){
  document.getElementById('tabs').innerHTML = TABS.map(t=>
    `<button class="${t.id===state.tab?'on':''}" onclick="setTab('${t.id}')">${t.label}</button>`).join('');
  const q=norm(state.q);
  let html = state.tab==='dagscore'?tDagscore(q):state.tab==='uitslag'?tUitslag(q):tTussenstand(q);
  document.getElementById('app').innerHTML = html + `<div class="meta-foot">Bijgewerkt: ${esc(D.generated_at)}</div>`;
}

render();
</script>
